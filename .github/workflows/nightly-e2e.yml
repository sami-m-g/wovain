# The golden path (apps/e2e, @smoke specs) every night against
# next.wovain.com with real providers (Qloo, Tavily, Nemotron, fal), as the
# seeded smoke account (apps/e2e/src/seed-smoke.ts). Not on deploy: it takes
# about 8 minutes. It stops after the designs: nothing is published, no ad
# is staged and nothing spends. A failure fails the run and reaches
# PostHog Error Tracking (apps/e2e/src/posthog-reporter.ts). Never
# production: playwright.config.ts refuses wovain.com.
name: nightly-e2e

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

env:
  CLOUD_SQL_PROXY_VERSION: v2.14.0

jobs:
  golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # next's variables and its Google trust (infra/next/index.ts).
    environment: next
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      # The seed reaches next's database through the same socket Cloud Run
      # mounts (deploy.yml).
      - name: Start the Cloud SQL Auth Proxy
        env:
          GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloud-sql-proxy" "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$CLOUD_SQL_PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          chmod +x "$RUNNER_TEMP/cloud-sql-proxy"
          sudo mkdir -p /cloudsql
          sudo chown "$(id -u)" /cloudsql
          "$RUNNER_TEMP/cloud-sql-proxy" --unix-socket /cloudsql --health-check "$GCP_SQL_INSTANCE" &
          "$RUNNER_TEMP/cloud-sql-proxy" wait --max 30s
      # Credentials from Secret Manager, masked and never printed.
      - name: Golden path on next
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DATABASE_URL_SECRET: ${{ vars.DATABASE_URL_SECRET }}
          E2E_SMOKE_PASSWORD_SECRET: ${{ vars.E2E_SMOKE_PASSWORD_SECRET }}
          E2E_BASE_URL: ${{ vars.SITE_URL }}
          E2E_EMAIL: e2e-smoke@wovain.com
          E2E_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          SMOKE_ENV: next
        run: |
          : "${E2E_SMOKE_PASSWORD_SECRET:?next has no E2E_SMOKE_PASSWORD_SECRET variable (infra/next/index.ts)}"
          E2E_PASSWORD=$(gcloud secrets versions access latest --secret "$E2E_SMOKE_PASSWORD_SECRET" --project "$GCP_PROJECT_ID")
          echo "::add-mask::$E2E_PASSWORD"
          DATABASE_URL=$(gcloud secrets versions access latest --secret "$DATABASE_URL_SECRET" --project "$GCP_PROJECT_ID")
          echo "::add-mask::$DATABASE_URL"
          export E2E_PASSWORD DATABASE_URL
          pnpm --filter @wovain/e2e run seed:smoke
          unset DATABASE_URL
          pnpm --filter @wovain/e2e exec playwright install --with-deps chromium
          pnpm --filter @wovain/e2e run test:smoke
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-e2e-report
          path: apps/e2e/playwright-report
          retention-days: 7
