# Pulumi from GitHub Actions (infra/README.md, "How infra changes ship").
#
# Pull request (same repository only): a read-only preview of every stack,
#   on a copy of the state (infra/scripts/pulumi.ts), in the
#   `infrastructure-preview` environment, which needs the owner's approval,
#   as infra-preview, which Google trusts only from that environment on this
#   repository's pull_request events and which can read but not change
#   anything (infra/bootstrap/preview.ts). The plan, and the guard's
#   verdict (infra/policy/guard.ts), go to the job summary.
# main, by hand only, and only once `wovain:freezeProduction` is false:
#   `pulumi up` of the prod stack in the `infrastructure` environment, which
#   waits for the owner's approval, as gitlab-infra (infra/bootstrap), after
#   the same preview and guard; then
#   the Polar catalog seed (packages/billing/src/seed.ts), which is
#   production's Polar organization, so it is skipped while
#   `wovain:freezeProduction` is on.
# Push to main: `pulumi up` of next.wovain.com's stack (infra/next) only, in
#   the `next-infrastructure` environment, as infra-next, which Google trusts
#   only from that environment on main and which can change only next's
#   resources (infra/bootstrap/next.ts). Production keeps its manual, gated
#   `up` below.
# Push to main: `pulumi up` of the GitHub repository's stack (infra/github)
#   too, in the `github-infrastructure` environment, as infra-github, which
#   Google trusts only from that environment on main and which can only
#   decrypt that stack's GitHub token and write its state
#   (infra/bootstrap/github.ts). Both github jobs skip until the owner has
#   created the stack and its token (infra/README.md, "The github stack").
#
# The bootstrap stack is CI's own identity, so CI only previews it; a project
# owner applies it (`pnpm run infra:bootstrap:up`).
#
# The ids below are infra/bootstrap's outputs. They are fixed: the first run
# can't read Actions variables that its own `up` creates.
name: infra

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - packages/billing/src/**
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
      - packages/billing/src/**
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: wovain
  PREVIEW_WORKLOAD_IDENTITY_PROVIDER: projects/422330561934/locations/global/workloadIdentityPools/github-pull-requests/providers/github
  PREVIEW_SERVICE_ACCOUNT: infra-preview@wovain.iam.gserviceaccount.com
  INFRA_WORKLOAD_IDENTITY_PROVIDER: projects/422330561934/locations/global/workloadIdentityPools/github/providers/github
  INFRA_SERVICE_ACCOUNT: gitlab-infra@wovain.iam.gserviceaccount.com
  NEXT_INFRA_SERVICE_ACCOUNT: infra-next@wovain.iam.gserviceaccount.com
  GITHUB_INFRA_SERVICE_ACCOUNT: infra-github@wovain.iam.gserviceaccount.com
  # Polar's webhook endpoint on production (packages/auth).
  POLAR_WEBHOOK_URL: https://wovain.com/api/auth/polar/webhooks

jobs:
  preview:
    # Fork pull requests get no OIDC token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The owner approves each run: the preview decrypts the stack secrets,
    # and Google trusts infra-preview only from this environment.
    environment: infrastructure-preview
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.PREVIEW_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PREVIEW_SERVICE_ACCOUNT }}
      - run: pnpm run infra:install
      # A failed preview still writes its JSON: scripts/pulumi.ts puts its
      # errors in the log and the guard puts them in the job summary. Every
      # stack is previewed, even after an earlier one fails.
      - name: Preview bootstrap
        run: |
          status=0
          node infra/scripts/pulumi.ts preview infra/bootstrap -- --json > "$RUNNER_TEMP/bootstrap.json" || status=$?
          echo "### bootstrap" >> "$GITHUB_STEP_SUMMARY"
          node infra/policy/guard.ts < "$RUNNER_TEMP/bootstrap.json" >> "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: Preview prod
        if: ${{ !cancelled() }}
        run: |
          status=0
          node infra/scripts/pulumi.ts preview infra -- --json > "$RUNNER_TEMP/prod.json" || status=$?
          echo "### prod" >> "$GITHUB_STEP_SUMMARY"
          node infra/policy/guard.ts < "$RUNNER_TEMP/prod.json" >> "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: Preview next
        if: ${{ !cancelled() }}
        run: |
          status=0
          node infra/scripts/pulumi.ts preview infra/next -- --json > "$RUNNER_TEMP/next.json" || status=$?
          echo "### next" >> "$GITHUB_STEP_SUMMARY"
          node infra/policy/guard.ts < "$RUNNER_TEMP/next.json" >> "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: Preview github
        if: ${{ !cancelled() }}
        run: |
          echo "### github" >> "$GITHUB_STEP_SUMMARY"
          if ! grep -q '^  github:token:' infra/github/Pulumi.github.yaml; then
            echo "Skipped: the github stack has no token yet (infra/README.md)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          node infra/scripts/pulumi.ts preview infra/github -- --json > "$RUNNER_TEMP/github.json" || status=$?
          node infra/policy/guard.ts < "$RUNNER_TEMP/github.json" >> "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"

  up-next:
    # Every push to main (and a manual run on main) applies next only. The
    # same guard as production's runs first (scripts/pulumi.ts).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: next-infrastructure
    permissions:
      contents: read
      id-token: write
    # One apply at a time; a newer one waits instead of cancelling an apply.
    concurrency:
      group: infra-up-next
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INFRA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.NEXT_INFRA_SERVICE_ACCOUNT }}
      - run: pnpm run infra:install
      - name: Apply next
        run: node infra/scripts/pulumi.ts up infra/next -- --yes --skip-preview

  # next's Polar catalog and promos, after next's apply. It touches next's
  # Polar state only: POLAR_METADATA_KEY=wovain:next keeps the seed off
  # production's plans, benefits and promos, the token is next's own secret,
  # and each promo's code goes to polar-promo-<id>-next, never to the log.
  # The seed is idempotent. It does not read or change production.
  # It needs no output of up-next: the catalog is read from the stack file and
  # the token from Secret Manager, so a failing up-next doesn't block it.
  polar-seed-next:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: next-infrastructure
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: polar-seed-next
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      # postinstall runs the Varlock codegen, which validates apps/web's env:
      # throwaway values, as in ci.yml. The seed reads none of them.
      - name: Generate placeholder env
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3001"
            echo "DATABASE_URL=postgresql://ci:$(openssl rand -hex 16)@localhost:5432/ci"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run infra:install
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INFRA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.NEXT_INFRA_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Seed Polar for next
        env:
          POLAR_ENVIRONMENT: sandbox
          POLAR_METADATA_KEY: wovain:next
          POLAR_WEBHOOK_URL: https://next.wovain.com/api/auth/polar/webhooks
          POLAR_WEBHOOK_SECRET_ID: polar-webhook-secret-next
        run: |
          POLAR_ACCESS_TOKEN=$(gcloud secrets versions access latest --secret polar-access-token-next --project "$GCP_PROJECT_ID")
          echo "::add-mask::$POLAR_ACCESS_TOKEN"
          export POLAR_ACCESS_TOKEN
          # next's catalog is its stack's config, the value up-next gives the app.
          BILLING_CATALOG=$(cd infra && node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parse } from "yaml";
            const { config } = parse(readFileSync("next/Pulumi.next.yaml", "utf-8"));
            process.stdout.write(JSON.stringify(config["wovain-next:billingCatalog"]));
          ')
          export BILLING_CATALOG
          node packages/billing/src/seed.ts

  up-github:
    # Every push to main (and a manual run on main) applies the repository's
    # settings and rulesets, after the same guard (scripts/pulumi.ts).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-infrastructure
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-up-github
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ready
        name: Check the stack has its token
        run: |
          if grep -q '^  github:token:' infra/github/Pulumi.github.yaml; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: the github stack has no token yet (infra/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - if: steps.ready.outputs.ready == 'true'
        uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      - if: steps.ready.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INFRA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GITHUB_INFRA_SERVICE_ACCOUNT }}
      - if: steps.ready.outputs.ready == 'true'
        run: pnpm run infra:install
      - if: steps.ready.outputs.ready == 'true'
        name: Apply github
        run: node infra/scripts/pulumi.ts up infra/github -- --yes --skip-preview

  # Whether production is frozen: `wovain:freezeProduction` in
  # infra/Pulumi.prod.yaml, on unless set to false (infra/index.ts, the
  # guard). Read from the checkout, before any credential.
  production-freeze:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frozen: ${{ steps.freeze.outputs.frozen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: infra/Pulumi.prod.yaml
          sparse-checkout-cone-mode: false
      - id: freeze
        name: Read wovain:freezeProduction
        run: |
          if grep -Eq '^[[:space:]]+wovain:freezeProduction:[[:space:]]*"?false"?[[:space:]]*$' infra/Pulumi.prod.yaml; then
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Production is frozen (wovain:freezeProduction): its pulumi up is skipped."
          fi

  up:
    # Manual only, and never while production is frozen (until the Transcend
    # winners, ~2026-11-16): a dispatch skips it, so a run started for
    # up-next or up-github can't apply production. The `infrastructure`
    # environment (infra/github) also waits for the owner's approval. To
    # apply, set `wovain:freezeProduction: "false"` in a pull request first.
    needs: production-freeze
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.production-freeze.outputs.frozen == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    # One apply at a time; a newer one waits instead of cancelling an apply.
    concurrency:
      group: infra-up
      cancel-in-progress: false
    outputs:
      polar-environment: ${{ steps.polar.outputs.environment }}
      production-frozen: ${{ steps.polar.outputs.frozen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INFRA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.INFRA_SERVICE_ACCOUNT }}
      - run: pnpm run infra:install
      # The guard stops the apply on a delete of stateful data or a change to
      # frozen production, before anything changes.
      - name: Preview and guard
        run: |
          node infra/scripts/pulumi.ts preview infra -- --json > "$RUNNER_TEMP/prod.json"
          node infra/policy/guard.ts < "$RUNNER_TEMP/prod.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        run: node infra/scripts/pulumi.ts up infra -- --yes --skip-preview
      - id: polar
        name: Read Polar's environment
        run: |
          echo "environment=$(pulumi config get polarEnvironment --cwd infra --stack prod 2>/dev/null || echo sandbox)" >> "$GITHUB_OUTPUT"
          echo "frozen=$(pulumi config get freezeProduction --cwd infra --stack prod 2>/dev/null || echo true)" >> "$GITHUB_OUTPUT"

  # wovain's plans, packs and promos in Polar, from packages/billing. The
  # seed is idempotent: it finds what it made by metadata, keeps an existing
  # webhook endpoint and its secret, and writes a promo's code or the
  # webhook's secret only to Secret Manager, never to the log.
  polar-seed:
    needs: up
    # Production's Polar organization and webhook: left alone while
    # production is frozen (infra/index.ts, freezeProduction).
    if: needs.up.outputs.production-frozen == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # postinstall runs the Varlock codegen, which validates apps/web's env:
      # throwaway values, as in ci.yml. The seed reads none of them.
      - name: Generate placeholder env
        run: |
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3001"
            echo "DATABASE_URL=postgresql://ci:$(openssl rand -hex 16)@localhost:5432/ci"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
          } >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.INFRA_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.INFRA_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Seed Polar
        env:
          POLAR_ENVIRONMENT: ${{ needs.up.outputs.polar-environment }}
        run: |
          POLAR_ACCESS_TOKEN=$(gcloud secrets versions access latest --secret polar-access-token --project "$GCP_PROJECT_ID")
          echo "::add-mask::$POLAR_ACCESS_TOKEN"
          export POLAR_ACCESS_TOKEN
          node packages/billing/src/seed.ts
