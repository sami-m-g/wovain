name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The checks run as parallel jobs; `verify`, the required check
# (infra/github.ts), passes only when every one of them passed. Each job
# sets up through .github/actions/setup and keeps its own Turborepo cache,
# saved only from main.
jobs:
  # Format and lint, the types, unused code and the OpenSpec specs. knip
  # runs after check-types, which builds the outputs it resolves imports
  # against (packages/widgets/dist).
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: lint
      - run: pnpm run check
      - run: pnpm run check-types
      - run: pnpm run knip
      - run: pnpm run boundaries
      - run: pnpm run spec:validate
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-lint-${{ github.sha }}

  # Every package's tests. packages/mastra's flow tests (PGlite, every
  # migration per test) take three minutes on one runner, so they run in
  # three shards beside the other packages' tests. The shard is passed to
  # vitest through turbo, so it is part of the task's hash and each shard
  # caches on its own.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            args: --filter=!@wovain/mastra
          - name: mastra 1/3
            args: --filter=@wovain/mastra -- --shard=1/3
          - name: mastra 2/3
            args: --filter=@wovain/mastra -- --shard=2/3
          - name: mastra 3/3
            args: --filter=@wovain/mastra -- --shard=3/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: test-${{ strategy.job-index }}
      - name: Test
        env:
          TURBO_ARGS: ${{ matrix.args }}
        # TURBO_ARGS is split into words on purpose: a filter, then vitest's.
        run: |
          # shellcheck disable=SC2086
          pnpm exec turbo run test $TURBO_ARGS
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-test-${{ strategy.job-index }}-${{ github.sha }}

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: build
      - run: pnpm run build
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}

  # Storybook (apps/web/.storybook): the static build, uploaded for review,
  # and every story as a component test in Chromium (play functions and the
  # a11y checks). Not part of `verify` nor a required check until it has
  # proved stable.
  storybook:
    name: storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache: storybook
      - run: pnpm run build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: apps/web/storybook-static
          retention-days: 7
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm run test-storybook
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-storybook-${{ github.sha }}

  # The required check: green only when every check above passed.
  verify:
    name: verify
    if: always()
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint, test, build: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job did not pass ($result)"
              exit 1
            fi
          done

  # infra/ is its own pnpm project outside the root workspace. `pulumi install`
  # installs it and generates the gitignored infra/sdks; the checks then run
  # against mocks, with no credentials.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      - run: pnpm run infra:install
      - run: pnpm run infra:check-types
      - run: pnpm run infra:test
