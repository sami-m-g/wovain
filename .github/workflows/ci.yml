name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Varlock validates env when Next loads its config (typegen and build).
      # Throwaway values are generated per run; real ones exist only at runtime.
      # The per-environment settings (apps/web/.env.schema) get CI's own
      # values, and the catalog and pricing rules the tests' fixtures.
      - name: Generate placeholder env
        run: |
          fixture() {
            node --input-type=module -e "const m = await import('$1'); console.log(JSON.stringify(m['$2']))"
          }
          {
            echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)"
            echo "BETTER_AUTH_URL=http://localhost:3001"
            echo "DATABASE_URL=postgresql://ci:$(openssl rand -hex 16)@localhost:5432/ci"
            echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "BILLING_CATALOG=$(fixture ./packages/billing/src/catalog-fixture.ts TEST_CATALOG)"
            echo "DOCS_URL=http://localhost:4000"
            echo "EMAIL_FROM=wovain <ci@example.com>"
            echo "FAL_MCP_URL=https://fal.example.com/mcp"
            echo "FOURTHWALL_DEFAULT_PRODUCT_ID=pro_ci"
            echo "FOURTHWALL_MCP_URL=https://fourthwall.example.com/mcp"
            echo "GUARDRAIL_INJECTION_THRESHOLD=0.8"
            echo "GUARDRAIL_MODERATION_THRESHOLD=0.7"
            echo "GUARDRAIL_PII_THRESHOLD=0.7"
            echo "MCP_URL=http://localhost:3001/api/mcp"
            echo "MCP_WIDGET_RESOURCE_DOMAINS=https://media.example.com"
            echo "META_MCP_SCOPE=ads_read"
            echo "META_MCP_URL=https://meta.example.com/mcp"
            echo "PRIVACY_EMAIL=privacy@example.com"
            echo "NEMOTRON_INPUT_PRICE=0.3"
            echo "NEMOTRON_OUTPUT_PRICE=0.9"
            echo "PRICING_RULES=$(fixture ./packages/core/src/config-fixture.ts TEST_PRICING_RULES)"
            echo "SUPPORT_EMAIL=support@example.com"
          } >> "$GITHUB_ENV"
      # postinstall runs the Varlock codegen (env:generate).
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm run check
      - run: pnpm run check-types
      - run: pnpm run knip
      - run: pnpm run spec:validate
      - run: pnpm run test
      - run: pnpm run build

  # infra/ is its own pnpm project outside the root workspace. `pulumi install`
  # installs it and generates the gitignored infra/sdks; the checks then run
  # against mocks, with no credentials.
  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - uses: pulumi/setup-pulumi@b374ceb6168550de27c6eba92e01c1a774040e11 # v2.0.0
      - run: pnpm run infra:install
      - run: pnpm run infra:check-types
      - run: pnpm run infra:test
