name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build cards and web
        run: bun run build
      - name: Lint and format
        run: bun run check
      - name: Typecheck (TypeScript 7, strict)
        run: bun run typecheck
      - name: Dead code
        run: bun run knip
      - name: Server tests
        run: bun run test
      - name: Card story tests
        run: |
          bunx playwright install --with-deps chromium
          bun run test:stories
