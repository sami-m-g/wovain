# Manual only until infra/ (this repository's ruleset, the `Production`
# environment, the Actions variables and Google's GitHub workload identity
# pool) is applied: see infra/README.md, "Leaving GitLab". Add a push trigger
# on main once a run here has deployed.
#
# Builds the web and docs images to Artifact Registry, applies the database
# migrations to Cloud SQL, then rolls both images out to Cloud Run:
#   wovain.com       apps/web        Cloud Run wovain-web
#   docs.wovain.com  apps/fumadocs   Cloud Run wovain-docs
# Every Google call goes through Workload Identity Federation as
# vars.GCP_DEPLOY_SERVICE_ACCOUNT, which Google trusts only from the
# `Production` environment on main (infra/index.ts, infra/bootstrap). No
# Google key is stored. Every variable below is set by Pulumi (infra/github.ts).
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; a newer one waits instead of cancelling a rollout.
concurrency:
  group: production
  cancel-in-progress: false

env:
  CLOUD_SQL_PROXY_VERSION: v2.14.0

jobs:
  image:
    name: image (${{ matrix.app }})
    runs-on: ubuntu-latest
    environment: Production
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
          - app: docs
            dockerfile: apps/fumadocs/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Varlock validates env while Next builds, so each build gets an env
      # file as a BuildKit secret, never a layer: placeholders for the web
      # app's secrets (Cloud Run supplies the real ones) and the public values
      # that are compiled in.
      - name: Write the build env files
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
        run: |
          {
            echo "BETTER_AUTH_SECRET=build-placeholder-never-used-at-runtime"
            echo "BETTER_AUTH_URL=${SITE_URL:-https://wovain.com}"
            echo "DATABASE_URL=postgresql://build:build@localhost:5432/build"
            echo "TOKEN_ENCRYPTION_KEY=YnVpbGQtcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk="
            if [ -n "$NEXT_PUBLIC_POSTHOG_KEY" ]; then
              echo "NEXT_PUBLIC_POSTHOG_KEY=$NEXT_PUBLIC_POSTHOG_KEY"
            fi
          } > "$RUNNER_TEMP/web_env"
          echo "SITE_URL=${DOCS_SITE_URL:-https://docs.wovain.com}" > "$RUNNER_TEMP/docs_env"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # One manifest per image, as Cloud Run expects.
          provenance: false
          sbom: false
          secret-files: ${{ matrix.app }}_env=${{ runner.temp }}/${{ matrix.app }}_env
          tags: ${{ vars.GCP_IMAGE_REPOSITORY }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # packages/db's Drizzle migrations, then Mastra's storage schema. The Cloud
  # SQL Auth Proxy makes the same /cloudsql/<instance> socket Cloud Run
  # mounts, so the database-url secret works as is. Migrations run before the
  # rollout and stay backward compatible with the running revision.
  migrate:
    runs-on: ubuntu-latest
    environment: Production
    needs: image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Start the Cloud SQL Auth Proxy
        env:
          GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cloud-sql-proxy" "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$CLOUD_SQL_PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          chmod +x "$RUNNER_TEMP/cloud-sql-proxy"
          sudo mkdir -p /cloudsql
          sudo chown "$(id -u)" /cloudsql
          "$RUNNER_TEMP/cloud-sql-proxy" --unix-socket /cloudsql --health-check "$GCP_SQL_INSTANCE" &
          "$RUNNER_TEMP/cloud-sql-proxy" wait --max 30s
      - name: Migrate
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          DATABASE_URL=$(gcloud secrets versions access latest --secret database-url --project "$GCP_PROJECT_ID")
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          pnpm --filter @wovain/db exec drizzle-kit migrate
          pnpm --filter @wovain/api run storage:init

  # A new revision of each service, with all traffic; Pulumi owns every other
  # setting of the services (infra/index.ts).
  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: Production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy wovain-web and wovain-docs
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_IMAGE_REPOSITORY: ${{ vars.GCP_IMAGE_REPOSITORY }}
        run: |
          gcloud run deploy wovain-web --image "$GCP_IMAGE_REPOSITORY/web:$GITHUB_SHA" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet
          gcloud run deploy wovain-docs --image "$GCP_IMAGE_REPOSITORY/docs:$GITHUB_SHA" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet
          # GitLab's canary pinned wovain-web's traffic to a tagged revision;
          # send it all to the newest one.
          gcloud run services update-traffic wovain-web --to-latest --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet
      # Registers the new revision's run workflow with Inngest Cloud
      # (docs/adr/0001-durable-runs.md). The Inngest keys are Pulumi's
      # (infra/index.ts), so a failure here is a real one and fails the
      # deploy; a revision that is still starting gets a few retries.
      - name: Sync Inngest
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: curl -sSf --retry 5 --retry-all-errors --retry-delay 10 -X PUT "$SITE_URL/api/inngest"
