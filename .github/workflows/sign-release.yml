# Signs one release's source tarball and attaches the proof to the GitHub
# Release. OpenSSF Scorecard's Signed-Releases check looks for *.sigstore.json
# or *.sig assets (a signature, score 8) and *.intoto.jsonl (SLSA provenance,
# score 10) on the last releases; it does not verify them:
# https://github.com/ossf/scorecard/blob/main/docs/checks.md#signed-releases
#
# Called by release.yml for a new release and by backfill-releases.yml for
# the releases made after the fact. Keyless: the signing identity is this
# workflow's OIDC token, recorded in the public Sigstore log; no key is stored.
#
# Verify a download:
#   cosign verify-blob --bundle wovain-<tag>.tar.gz.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/sami-m-g/wovain/\.github/workflows/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com wovain-<tag>.tar.gz
#   gh attestation verify wovain-<tag>.tar.gz --repo sami-m-g/wovain
name: sign-release

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to sign, for example v0.32.0
        required: true
        type: string

permissions: {}

jobs:
  sign:
    name: sign ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Uploading the assets to the release.
      contents: write
      # Keyless signing and the provenance attestation.
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The source as `git archive` writes it for the tag: the same bytes as
      # long as the commit is the same.
      - name: Archive the source
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          git archive --format=tar.gz --prefix="wovain-$TAG/" -o "$RUNNER_TEMP/release/wovain-$TAG.tar.gz" "refs/tags/$TAG"
      - name: Sign the archive
        working-directory: ${{ runner.temp }}/release
        run: cosign sign-blob --yes --bundle "wovain-$TAG.tar.gz.sigstore.json" "wovain-$TAG.tar.gz"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/wovain-${{ inputs.tag }}.tar.gz
      - name: Upload to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/release/wovain-$TAG.tar.gz.intoto.jsonl"
          gh release upload "$TAG" --clobber \
            "$RUNNER_TEMP/release/wovain-$TAG.tar.gz" \
            "$RUNNER_TEMP/release/wovain-$TAG.tar.gz.sigstore.json" \
            "$RUNNER_TEMP/release/wovain-$TAG.tar.gz.intoto.jsonl"
