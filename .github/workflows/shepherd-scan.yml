# The shepherd's backstop (#248), with no model: every 30 minutes it walks the
# open pull requests and
# - dispatches the shepherd (shepherd.yml) for one that has a failed check or
#   changes requested; the shepherd's gate allows one attempt per head commit,
#   so a dispatch on a pull request it already tried costs nothing;
# - labels `needs-human` one that has a merge conflict;
# - comments `@coderabbitai review` once on one whose head commit has had no
#   CodeRabbit review for 15 minutes, unless CodeRabbit's newest comment is
#   its rate-limit notice (AGENTS.md, "CodeRabbit review loop").
# Skips drafts, forks, Dependabot, release-please, `needs-human` and
# `autofix` (Claude's cloud Auto-fix watches those).
name: shepherd-scan

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: shepherd-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      # statusCheckRollup reads check runs and commit statuses.
      checks: read
      issues: write
      pull-requests: write
      statuses: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          prs=$(gh pr list --state open --limit 100 \
            --json number,isDraft,isCrossRepository,headRefName,headRefOid,mergeable,reviewDecision,statusCheckRollup,labels)
          jq -c '.[]
            | select(.isDraft | not) | select(.isCrossRepository | not)
            | select(.headRefName | test("^(dependabot/|release-please--)") | not)
            | select(.labels | map(.name) | (index("needs-human") or index("autofix")) | not)' <<<"$prs" |
          while read -r pr; do
            n=$(jq -r .number <<<"$pr")
            if [ "$(jq -r .mergeable <<<"$pr")" = CONFLICTING ]; then
              gh pr edit "$n" --add-label needs-human || { echo "::warning::#$n: could not add needs-human"; continue; }
              gh pr comment "$n" --body "This pull request has a merge conflict. A person rebases it, or asks Claude to." ||
                echo "::warning::#$n: could not comment"
              continue
            fi
            head=$(jq -r .headRefOid <<<"$pr")
            detail=$(gh pr view "$n" --json reviews,comments,commits) || { echo "::warning::#$n: could not read"; continue; }
            failed=$(jq '[.statusCheckRollup[] | select(.conclusion == "FAILURE")] | length' <<<"$pr")
            # Each reviewer's latest decision on this head only: the decision
            # stays CHANGES_REQUESTED after a fix until the reviewer sees the
            # new head, and a later approval supersedes a change request.
            changes=$(jq --arg h "$head" '[.reviews[]
              | select(.commit.oid == $h and (.state == "APPROVED" or .state == "CHANGES_REQUESTED"))]
              | group_by(.author.login) | map(last | select(.state == "CHANGES_REQUESTED")) | length' <<<"$detail")
            if [ "$failed" -gt 0 ] || [ "$changes" -gt 0 ]; then
              gh workflow run shepherd.yml -f pr="$n" || echo "::warning::#$n: dispatch failed"
              continue
            fi
            pushed=$(jq -r '.commits[-1].committedDate' <<<"$detail")
            reviewed=$(jq --arg h "$head" '[.reviews[] | select(.author.login == "coderabbitai" and .commit.oid == $h)] | length' <<<"$detail")
            asked=$(jq --arg t "$pushed" '[.comments[] | select(.createdAt > $t and (.body | contains("@coderabbitai")))] | length' <<<"$detail")
            limited=$(jq -r '[.comments[] | select(.author.login == "coderabbitai")] | last | .body // "" | contains("review will be available in")' <<<"$detail")
            if [ "$reviewed" -eq 0 ] && [ "$asked" -eq 0 ] && [ "$limited" = false ] &&
              [ $(( now - $(date -u -d "$pushed" +%s) )) -gt 900 ]; then
              gh pr comment "$n" --body "@coderabbitai review" || echo "::warning::#$n: could not comment"
            fi
          done
