version: 2

updates:
  # Root pnpm workspace, including the catalog in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels: [dependencies]
    groups:
      # Drizzle v1 ships rc releases and branch snapshots; keep them together.
      drizzle:
        patterns: [drizzle-orm, drizzle-kit]
      playwright:
        patterns: [playwright, "@playwright/*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns:
          [drizzle-orm, drizzle-kit, playwright, "@playwright/*"]
    ignore:
      # High-churn SDK whose new APIs are unused; bump it by hand.
      - dependency-name: openai
        update-types: [version-update:semver-minor, version-update:semver-patch]
      # 0.x minors are breaking: stay on the 0.221 line @mastra/otel-exporter
      # supports (see the comment on the catalog entry in pnpm-workspace.yaml).
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        update-types: [version-update:semver-minor]

  # infra/ is its own pnpm project outside the root workspace.
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(infra-deps)"
      prefix-development: "chore(infra-deps-dev)"
    labels: [dependencies]
    groups:
      # The Pulumi SDK moves together with its providers.
      pulumi:
        patterns: ["@pulumi/*"]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@pulumi/*"]
    ignore:
      # Generated by `pulumi install`, not on a registry.
      - dependency-name: "@pulumi/graphql"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/web
      - /apps/fumadocs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels: [dependencies]
    groups:
      docker-compose:
        patterns: ["*"]
