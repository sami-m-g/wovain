name: Bug report
description: Something in wovain isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Production
        - Local (pnpm dev)
        - CI
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time it happened (UTC)
  - type: textarea
    id: debug
    attributes:
      label: Debug info
      description: Error text, job link, deploy revision or trace id. Never paste tokens, keys or customer data.
      render: text
