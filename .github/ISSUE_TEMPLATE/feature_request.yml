name: Feature request
description: An idea for wovain. Lead with the problem.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is this for, and what is hard for them today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would they see or do differently? Sketches and links welcome.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      placeholder: |
        - [ ]
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this should not try to do, so it stays small.
