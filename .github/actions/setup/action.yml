# The setup every CI job shares: pnpm and Node with the pnpm store cached
# (one store for every job, keyed on the lockfile), the placeholder env
# Varlock validates, the install, and the Turborepo Remote Cache.
name: setup
description: Install the workspace and connect the Turborepo Remote Cache

inputs:
  turbo-cache:
    description: "'true' to use the Turborepo Remote Cache; empty for none"
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Reads the pnpm version from the packageManager field in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Varlock validates env when Next loads its config (typegen and build);
    # real values exist only at runtime, so CI gets fixed placeholders
    # (.config/placeholder-env.sh, shared with the pre-push hook).
    - name: Write the placeholder env
      shell: bash
      run: .config/placeholder-env.sh >> "$GITHUB_ENV"
    # postinstall runs the Varlock codegen (env:generate).
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
    # Turborepo's Remote Cache on the GitHub Actions cache (caching-for-turbo
    # serves the Remote Cache API on localhost and sets TURBO_API, TURBO_TOKEN
    # and TURBO_TEAM). Each task's output is its own cache entry, fetched only
    # when its hash is asked for, so a job downloads what it replays instead of
    # one archive of every job's history. Entries a pull request writes are
    # scoped to it; main's are read by every pull request.
    - if: inputs.turbo-cache == 'true'
      uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
