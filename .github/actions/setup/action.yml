# The setup every CI job shares: pnpm and Node with the pnpm store cached
# (one store for every job, keyed on the lockfile), the placeholder env
# Varlock validates, the install, and the job's own Turborepo cache.
name: setup
description: Install the workspace and restore the job's Turborepo cache

inputs:
  turbo-cache:
    description: The name of this job's Turborepo cache; empty for none
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Reads the pnpm version from the packageManager field in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Varlock validates env when Next loads its config (typegen and build).
    # Real values exist only at runtime: these are fixed, obviously fake
    # placeholders. Fixed rather than random per run: every one of them is in
    # turbo.json's globalEnv, so a random value changed every task's hash and
    # Turborepo never had a cache hit. The per-environment settings
    # (apps/web/.env.schema) get CI's own values, and the catalog and pricing
    # rules the tests' fixtures.
    - name: Write the placeholder env
      shell: bash
      run: |
        fixture() {
          node --input-type=module -e "const m = await import('$1'); console.log(JSON.stringify(m['$2']))"
        }
        # Derived from public strings, so the values are the same on every
        # run without a key-shaped literal in the repository. Anyone can
        # recompute them: they protect nothing and are used only in CI.
        placeholder() {
          printf 'wovain-ci-placeholder-%s' "$1" | sha256sum | cut -c1-64
        }
        {
          echo "BETTER_AUTH_SECRET=$(placeholder better-auth)"
          echo "BETTER_AUTH_URL=http://localhost:3001"
          echo "DATABASE_URL=postgresql://ci:$(placeholder database | cut -c1-32)@localhost:5432/ci"
          echo "TOKEN_ENCRYPTION_KEY=$(placeholder token-encryption | xxd -r -p | base64)"
          echo "BILLING_CATALOG=$(fixture ./packages/billing/src/catalog-fixture.ts TEST_CATALOG)"
          echo "DOCS_URL=http://localhost:4000"
          echo "EMAIL_FROM=wovain <ci@example.com>"
          echo "FAL_ART_MODELS=$(fixture ./packages/core/src/config-fixture.ts TEST_ART_MODELS)"
          echo "FAL_MCP_URL=https://fal.example.com/mcp"
          echo "FOURTHWALL_DEFAULT_PRODUCT_ID=pro_ci"
          echo "FOURTHWALL_MCP_URL=https://fourthwall.example.com/mcp"
          echo "GUARDRAIL_INJECTION_THRESHOLD=0.8"
          echo "GUARDRAIL_MODERATION_THRESHOLD=0.7"
          echo "GUARDRAIL_PII_THRESHOLD=0.7"
          echo "MCP_URL=http://localhost:3001/api/mcp"
          echo "MCP_WIDGET_RESOURCE_DOMAINS=https://media.example.com"
          echo "META_MCP_SCOPE=ads_read"
          echo "META_MCP_URL=https://meta.example.com/mcp"
          echo "PRIVACY_EMAIL=privacy@example.com"
          echo "NEMOTRON_INPUT_PRICE=0.3"
          echo "NEMOTRON_OUTPUT_PRICE=0.9"
          echo "PRICING_RULES=$(fixture ./packages/core/src/config-fixture.ts TEST_PRICING_RULES)"
          echo "SUPPORT_EMAIL=support@example.com"
        } >> "$GITHUB_ENV"
    # postinstall runs the Varlock codegen (env:generate).
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline
    # Turborepo's local cache, one per job. Only a push to main saves it
    # (ci.yml), so pull requests read main's latest and never crowd it out of
    # the repository's 10 GB: a package a pull request leaves alone replays
    # main's result instead of running again. Entries older than a week are
    # dropped, so the cache does not grow without end.
    - if: inputs.turbo-cache != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ inputs.turbo-cache }}-
    - if: inputs.turbo-cache != ''
      name: Drop week-old cache entries
      shell: bash
      run: |
        if [ -d .turbo/cache ]; then
          find .turbo/cache -type f -mtime +7 -delete
        fi
