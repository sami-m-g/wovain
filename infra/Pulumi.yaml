# wovain's Google Cloud setup: `pnpm infra:preview`, then `pnpm infra:up`.
# State lives in a Cloud Storage bucket in the project (see README).
name: wovain
description: Cloud Run, Cloud SQL, media bucket, secrets, DNS and the GitHub repository for wovain
runtime:
  name: nodejs
  options:
    # Node runs index.ts itself (type stripping), so no ts-node.
    typescript: false
    packagemanager: pnpm
backend:
  url: gs://wovain-pulumi-state
