# wovain's Google Cloud setup: `pnpm infra:preview`, then `pnpm infra:up`.
# State lives in a Cloud Storage bucket in the project (see README).
name: wovain
description: Cloud Run, Cloud SQL, media bucket, secrets, DNS, the GitHub repository and PostHog for wovain
runtime:
  name: nodejs
  options:
    # Node runs index.ts itself (type stripping), so no ts-node.
    typescript: false
    packagemanager: pnpm
backend:
  url: gs://wovain-pulumi-state
# Generated SDK in sdks/posthog (`pulumi package add terraform-provider
# posthog/posthog`): PostHog's official Terraform provider, bridged, for
# posthog/program.ts. PostHog publishes no Pulumi package of its own.
packages:
  posthog:
    source: terraform-provider
    version: 1.5.0
    # Pin the provider too: pulumi install regenerates the SDK on every run.
    parameters:
      - posthog/posthog
      - 1.0.27
