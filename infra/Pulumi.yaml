# wovain's Google Cloud setup: `pnpm infra:preview`, then `pnpm infra:up`.
# State lives in a Cloud Storage bucket in the project (see README).
name: wovain
description: Firebase App Hosting, Firestore, media bucket, secrets and CI access for wovain
runtime:
  name: nodejs
  options:
    # Node 24 runs index.ts itself (type stripping), so no ts-node.
    typescript: false
    packagemanager: pnpm
# Generated SDK in sdks/graphql (`pulumi package add terraform-provider
# sullivtr/graphql`): the Duo flow triggers in duo.ts. GitLab's own provider has
# no resource for them.
packages:
  graphql:
    source: terraform-provider
    version: 1.5.0
    # Pin the provider too: pulumi install regenerates the SDK on every run.
    parameters:
      - sullivtr/graphql
      - 2.6.2
backend:
  url: gs://wovain-pulumi-state
