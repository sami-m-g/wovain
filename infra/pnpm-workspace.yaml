# infra/ is its own pnpm project, outside the root workspace, so app installs
# (CI, the web image) never pull Pulumi packages. `pulumi install` installs it
# and generates sdks/graphql (gitignored) from the packages in Pulumi.yaml.
allowBuilds:
  # The generated provider SDKs compile themselves on install.
  "@pulumi/graphql@file:sdks/graphql": true
  protobufjs: false
