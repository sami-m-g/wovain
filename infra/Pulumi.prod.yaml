config:
  # GitLab Duo flow triggers on GitLab's built-in flows (infra/duo.ts). flow is
  # the flow's foundationalFlowReference; events use GitLab's EVENT_TYPES names.
  # Filters only accept the fields in ALLOWED_FILTER_FIELDS
  # (ee/app/models/ai/flow_trigger.rb): merge requests by action, pipelines by
  # status, source, ref and default_branch. Each trigger fires only on a human
  # action or a red main, so Duo credits go where they matter.
  wovain:duoTriggers:
    - name: duo-developer
      description: Developer flow on assign or mention
      flow: developer/v1
      serviceAccount: duo-developer-gitlab-ai-hackathon
      events: [assign, mention]
      active: false # off: no Duo credits until turned back on
    - name: duo-fix-pipeline
      description: Fix CI/CD on a failed push pipeline on main
      flow: fix_pipeline/v1
      serviceAccount: duo-fix-ci-cd-pipeline-gitlab-ai-hackathon
      events: [pipeline_hooks]
      active: false # off: no Duo credits until turned back on
      # Main only: on work-in-progress branches it opened draft MRs nobody
      # wanted (!19, !20). Mention it on an MR to fix a branch by hand.
      filter:
        pipeline_hooks:
          match: all
          rules:
            - field: object_attributes.status
              operator: in
              value: [failed]
            - field: object_attributes.default_branch
              operator: in
              value: [true]
            - field: object_attributes.source
              operator: in
              value: [push]
    - name: duo-code-review
      description: Code review when Duo is asked to review or an MR is marked ready
      flow: code_review/v1
      serviceAccount: duo-code-review-gitlab-ai-hackathon
      # Human actions only, so Renovate's MRs and drafts cost nothing; the
      # /issue skill requests this reviewer when it opens an MR.
      events: [assign_reviewer, merge_request_ready]
      active: false # off: no Duo credits until turned back on
  # Custom flows from .gitlab/duo/catalog/flows, enabled once synced.
  # Off: enabling a custom flow at project level created no flow trigger (it
  # likely needs a group-level consumer first), and no Duo credits until turned
  # back on. The consumer GitLab already has stays, unmanaged and idle.
  wovain:duoCustomFlows: []
  #   - name: duo-scout
  #     file: .gitlab/duo/catalog/flows/scout.yml
  #     events: [scheduled]
  #     schedule:
  #       cron: "0 7 * * *"
  #       timezone: UTC
  #       description: wovain scout, daily
  # AuthKit redirect URIs (infra/workos.ts). import adopts an entry made by
  # hand, by its WorkOS id.
  wovain:workosRedirectUris:
    - name: hosted
      uri: https://app--wovain.us-central1.hosted.app/mcp
      import: redir_01M5HQD3PBAXJ69NRBS31CK0VP
    - name: localhost
      uri: http://localhost:3000/mcp
      import: redir_01M5HQD44DBG42CHS3W7XWB68J
  # AuthKit MCP resource indicators (infra/workos.ts). default is the resource
  # a client gets when it names none; import adopts an entry made by hand.
  wovain:workosResourceIndicators:
    - name: hosted
      uri: https://app--wovain.us-central1.hosted.app/mcp
      default: true
    - name: localhost
      uri: http://localhost:3000/mcp
      import: authkit_oauth_resource_01M5F7QQ0HM9RZ7NDY9X1TEXWX
