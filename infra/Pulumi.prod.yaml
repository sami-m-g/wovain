config:
  # GitLab Duo flow triggers on GitLab's built-in flows (infra/duo.ts). flow is
  # the flow's foundationalFlowReference; events use GitLab's EVENT_TYPES names.
  # Filters only accept the fields in ALLOWED_FILTER_FIELDS
  # (ee/app/models/ai/flow_trigger.rb): merge requests by action, pipelines by
  # status, source, ref and default_branch. Each trigger fires only on a
  # human action, so Duo credits go where they matter; a red main goes
  # through the loop's gate instead (apps/ops/src/gates.ts), since filters
  # can't dedupe or tell job types apart. GitLab never starts a flow for a
  # bot's or another flow's action (run_service.rb,
  # cloud_events_flow_trigger_worker.rb), so the self-healing loop
  # (apps/ops, docs/loop.md) assigns and requests review with GITLAB_TOKEN,
  # a person's token: that is what chains Developer → Code Review here.
  wovain:duoTriggers:
    - name: duo-developer
      description: Developer flow on assign or mention
      flow: developer/v1
      serviceAccount: duo-developer-gitlab-ai-hackathon
      events: [assign, mention]
      active: true
    - name: duo-fix-pipeline
      description: Fix CI/CD on a failed push pipeline on main
      flow: fix_pipeline/v1
      serviceAccount: duo-fix-ci-cd-pipeline-gitlab-ai-hackathon
      events: [pipeline_hooks]
      # Off: replaced by the gated path in the loop job (apps/ops/src/
      # red-main.ts, gates.ts). This trigger fired on every red push to main,
      # infra 403s and auth 404s included (7 runs in 30 minutes), and its
      # filters can't dedupe or tell job types apart. The loop starts the
      # same flow through the API only for a new, confirmed code failure, at
      # most once an hour and 3 times a day. Kept configured so it can be
      # switched back on. On work-in-progress branches it opened draft MRs
      # nobody wanted (!19, !20); "Fix pipeline with Duo" fixes one by hand.
      active: false
      filter:
        pipeline_hooks:
          match: all
          rules:
            - field: object_attributes.status
              operator: in
              value: [failed]
            - field: object_attributes.default_branch
              operator: in
              value: [true]
            - field: object_attributes.source
              operator: in
              value: [push]
    - name: duo-code-review
      description: Code review on every new merge request, and on request
      flow: code_review/v1
      serviceAccount: duo-code-review-gitlab-ai-hackathon
      # Every merge request a person opens (the merge_request event, action
      # created, drafts included; 0.25 credit each), plus a re-review
      # whenever someone requests Duo as reviewer. Until 2026-10-26 this was
      # assign_reviewer only, and since nothing asks for a review on a
      # person's MR (only the shepherd does, for Duo's own MRs), !69–!111 got
      # no review. Duo's own MRs still go through the shepherd: GitLab starts
      # no flow for a service account's action. code_review/v1 accepts any
      # event (it has no supported_events); merge_request filters accept
      # only action, one of approved, created, merged, requested_changes
      # (ee/app/models/ai/flow_trigger.rb, ALLOWED_FILTER_ACTIONS).
      events: [assign_reviewer, merge_request]
      active: true
      filter:
        merge_request:
          match: all
          rules:
            - field: action
              operator: in
              value: [created]
  # Custom flows from .gitlab/duo/catalog/flows: a trigger for the consumer
  # the project already has (infra/duo.ts). The scout starts on a successful
  # child pipeline on main, which only the weekly schedule's scout:duo job
  # creates (.gitlab/ci/loop.yml); its prompt is fixed text. No mention
  # trigger: anyone who comments could steer it. No scheduled trigger: GitLab
  # gives it a service account created in the project, which needs
  # create_service_account (Maintainer).
  wovain:duoCustomFlows:
    - name: duo-scout
      file: .gitlab/duo/catalog/flows/scout.yml
      description: wovain scout, weekly from the scout child pipeline
      events: [pipeline_hooks]
      active: true
      filter:
        pipeline_hooks:
          match: all
          rules:
            - field: object_attributes.status
              operator: in
              value: [success]
            - field: object_attributes.default_branch
              operator: in
              value: [true]
            - field: object_attributes.source
              operator: in
              value: [parent_pipeline]
  # Custom agents from .gitlab/duo/catalog/agents, enabled in the project once
  # synced (mapping.json).
  wovain:duoCustomAgents:
    - name: duo-explain
      file: .gitlab/duo/catalog/agents/explain.yml
