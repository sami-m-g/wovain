# wovain's pipeline, one stage per DevSecOps step it covers:
#   verify   lint and format, types (apps, packages and infra/), dead code,
#            tests and the turbo build
#   test     GitLab SAST, IaC scanning, Secret Detection and Dependency
#            Scanning (secure.yml)
#   deploy   main only, in parallel: pulumi up (infra/) when it changed;
#            package the web and docs images (the docs one only when it
#            changed) into the GitLab and Google registries, then Container
#            Scanning; migrate Cloud SQL; then roll out to Cloud Run.
#            FORCE_ALL=1 applies and builds everything (deploy.yml)
#   monitor  smoke-test wovain.com and docs.wovain.com
#   Duo      three flows run the post-code lifecycle (docs/flows.md):
#            self-healing (ops job, heal flow, heal:verify), KPI scout
#            (scout:collect, scout flow) and issue to completion (ops job,
#            Developer flow, Duo Code Review, auto-merge)
# Renovate runs on the "Renovate dependency updates" pipeline schedule; the
# ops job on "wovain ops" (every 10 minutes) and the scout on "wovain scout"
# (daily), or now with Run pipeline and OPS=1 or SCOUT=1.
# CI variables: GITLAB_TOKEN, RENOVATE_TOKEN, GCP_PROJECT_ID, GCP_REGION,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_INFRA_SERVICE_ACCOUNT,
# GCP_DEPLOY_SERVICE_ACCOUNT, GCP_OPS_SERVICE_ACCOUNT, GCP_IMAGE_REPOSITORY,
# GCP_SQL_INSTANCE, GCP_PREVIEW_SERVICE_ACCOUNT, GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER,
# GCP_PROJECT_NUMBER, GCP_WORKLOAD_IDENTITY_FEDERATION_POOL_ID,
# GCP_WORKLOAD_IDENTITY_FEDERATION_PROVIDER_ID (the migrate jobs' secrets),
# SITE_URL, DEV_SITE_URL, DOCS_SITE_URL and GITHUB_MIRROR_KEY. Pulumi sets them all
# (infra/index.ts), as it does the PostHog ones (POSTHOG_PERSONAL_API_KEY,
# POSTHOG_PROJECT_ID, POSTHOG_TRIGGER_TOKEN) and Polar's (POLAR_ACCESS_TOKEN,
# POLAR_ENVIRONMENT); don't edit them in the UI.
# The ops jobs also read
# TRUSTED_USERS (who may hand issues to Duo), DUO_<NAME>_ACCOUNT for each
# custom flow (DUO_HEAL_ACCOUNT; Pulumi sets them from the accounts GitLab
# created, infra/duo.ts) and, when GitLab names the built-in flows' service
# accounts differently from apps/ops/src/env.ts, DUO_DEVELOPER_ACCOUNT and
# DUO_REVIEW_ACCOUNT.

# A new commit cancels the branch's or merge request's running pipeline when
# all its started jobs are interruptible (the default below). The deploy,
# migrate, infra, image and canary jobs set interruptible: false, so a
# pipeline that has reached one finishes.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Jobs live in .gitlab/ci/, one file per stage plus the shared templates.
# The Duo flows (docs/flows.md) add the catalog sync (duo.yml), heal:verify
# (heal.yml), the ops job and SCI (ops.yml), and the KPI scout (scout.yml).
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/SAST-IaC.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  # Custom Duo flows and agents: validated on change, synced to the AI
  # Catalog on main.
  - component: $CI_SERVER_FQDN/components/ai-catalog/catalog-sync@0.0.32
    inputs:
      agent_directory: .gitlab/duo/catalog/agents
      flow_directory: .gitlab/duo/catalog/flows
      mapping_file: .gitlab/duo/catalog/mapping.json
      gitlab_token: $GITLAB_TOKEN
      # The hackathon role can't enable flows in the top-level group, which
      # the component does first; infra/duo.ts enables them in the project.
      enable_in_project: "false"
      public: "false"
      version: $CI_COMMIT_SHORT_SHA
  # OpenTofu job templates for the PostHog configuration (posthog.yml).
  - component: $CI_SERVER_FQDN/components/opentofu/job-templates@4.9.0
    inputs:
      version: 4.9.0
      opentofu_version: 1.12.6
      root_dir: infra/posthog
      state_name: posthog
      stage_validate: verify
      stage_build: test
      stage_deploy: deploy
  # The renovate job (verify.yml narrows its rules).
  - project: renovate-bot/renovate-runner
    ref: v26.1.0
    file: /templates/renovate.gitlab-ci.yml
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/secure.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/duo.yml
  - local: .gitlab/ci/heal.yml
  - local: .gitlab/ci/ops.yml
  - local: .gitlab/ci/scout.yml
  - local: .gitlab/ci/posthog.yml
  - local: .gitlab/ci/polar.yml

stages:
  - verify
  - test
  - deploy
  - monitor

default:
  image: node:26
  interruptible: true

variables:
  # Run SAST and Secret Detection on merge requests too, not only on main.
  AST_ENABLE_MR_PIPELINES: "true"
  PNPM_VERSION: 12.3.4
  PULUMI_VERSION: 3.259.0
