# wovain's pipeline, one stage per DevSecOps step it covers:
#   verify   lint and format, types (apps, packages and infra/), dead code,
#            tests and the turbo build
#   test     GitLab SAST, Secret Detection and Dependency Scanning (secure.yml)
#   deploy   main only: pulumi up (infra/), build and push the web image,
#            migrate Cloud SQL, roll the image out to Cloud Run
#   monitor  smoke-test the live site
# Renovate runs on the "Renovate dependency updates" pipeline schedule.
# CI variables: GITLAB_TOKEN, RENOVATE_TOKEN, GCP_PROJECT_ID, GCP_REGION,
# GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_INFRA_SERVICE_ACCOUNT,
# GCP_DEPLOY_SERVICE_ACCOUNT, GCP_OPS_SERVICE_ACCOUNT, GCP_IMAGE_REPOSITORY,
# GCP_SQL_INSTANCE and SITE_URL. Pulumi sets them all (infra/index.ts); don't
# edit them in the UI.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Jobs live in .gitlab/ci/, one file per stage plus the shared templates. The
# self-healing loop's files belong to the ops work and are included only once
# they exist.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/secure.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/duo.yml
    rules:
      - exists: [.gitlab/ci/duo.yml]
  - local: .gitlab/ci/loop.yml
    rules:
      - exists: [.gitlab/ci/loop.yml]
  - local: .gitlab/ci/monitor.yml
    rules:
      - exists: [.gitlab/ci/monitor.yml]

stages:
  - verify
  - test
  - deploy
  - monitor

default:
  image: node:26
  interruptible: true

variables:
  # Run SAST and Secret Detection on merge requests too, not only on main.
  AST_ENABLE_MR_PIPELINES: "true"
  PNPM_VERSION: 12.3.4
  PULUMI_VERSION: 3.259.0
