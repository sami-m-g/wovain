# wovain's pipeline, one job per DevSecOps stage it covers:
#   verify    build; lint, types, dead code, tests; widget stories; the
#             e2e journey proof and demo video (proof.yml)
#   test      GitLab SAST, Secret Detection, Dependency Scanning (Secure)
#   deploy    main: sync custom Duo flows to the AI Catalog, pulumi up
#             (infra/), then upload the source to Firebase App Hosting and
#             roll it out
#   monitor   smoke-test the live OAuth chain; hourly, the self-healing loop
#             (scout, verify, shepherd Duo's merge requests to auto-merge)
#   release   semantic-release: version, CHANGELOG, GitLab release; then
#             push main and tags to the GitHub mirror
# Renovate runs on the "Renovate dependency updates" pipeline schedule, the
# loop on "wovain loop", the live e2e journey on "Nightly e2e".
# CI variables: GITLAB_TOKEN, RENOVATE_TOKEN, GITHUB_MIRROR_KEY,
# FIREBASE_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_INFRA_SERVICE_ACCOUNT,
# GCP_DEPLOY_SERVICE_ACCOUNT, GCP_OPS_SERVICE_ACCOUNT, SITE_URL,
# GITLAB_OBSERVABILITY_EXPORT, GITLAB_O11Y_URL and (once its stack secret is
# set) GITLAB_O11Y_API_KEY. Pulumi sets them all (infra/index.ts); don't edit
# them in the UI.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

# Jobs live in .gitlab/ci/, one file per stage plus the shared templates.
include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  # Custom Duo flows: validated on change, synced to the AI Catalog on main.
  - component: $CI_SERVER_FQDN/components/ai-catalog/catalog-sync@0.0.32
    inputs:
      agent_directory: .gitlab/duo/catalog/agents
      flow_directory: .gitlab/duo/catalog/flows
      mapping_file: .gitlab/duo/catalog/mapping.json
      gitlab_token: $GITLAB_TOKEN
      # Our role can't enable flows in the top-level group, which the component
      # does first, so it only syncs; infra/duo.ts enables them in the project.
      enable_in_project: "false"
      public: "false"
      # Only a label in the mapping file; the sync runs on main, not on tags.
      version: $CI_COMMIT_SHORT_SHA
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/verify.yml
  - local: .gitlab/ci/proof.yml
  - local: .gitlab/ci/secure.yml
  - local: .gitlab/ci/deploy.yml
  - local: .gitlab/ci/monitor.yml
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/duo.yml
  - local: .gitlab/ci/loop.yml

stages:
  - verify
  - test
  - deploy
  - monitor
  - release

default:
  image: node:24
  interruptible: true

variables:
  # Run SAST and Secret Detection on merge requests too, not only on main.
  AST_ENABLE_MR_PIPELINES: "true"
  PNPM_VERSION: 12.3.4
  PULUMI_VERSION: 3.259.0
