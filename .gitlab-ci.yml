# wovain's pipeline, one job per DevSecOps stage it covers:
#   verify    build, lint, types, dead code, tests, card stories
#   test      GitLab SAST, Secret Detection, Dependency Scanning (Secure)
#   package   the ChatGPT plugin zip
#   deploy    merge requests: a Vercel preview on its own Neon branch;
#             main: production
#   monitor   smoke-test the live OAuth chain
#   release   semantic-release: version, CHANGELOG, GitLab release + plugin zip
# Renovate runs on the "Renovate dependency updates" pipeline schedule.
# CI variables: VERCEL_TOKEN, NEON_API_KEY, GITLAB_TOKEN, RENOVATE_TOKEN
# (all masked), VERCEL_ORG_ID, VERCEL_PROJECT_ID, NEON_PROJECT_ID.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

stages:
  - verify
  - test
  - package
  - deploy
  - monitor
  - release

default:
  image: oven/bun:1.4.2
  interruptible: true

variables:
  BUN_VERSION: 1.4.2
  NEONCTL: neonctl@8.8.0
  VERCEL_CLI: vercel@64.0.2

# Every push and merge request, but not the Renovate schedule.
.on-changes:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: on_success

.on-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.bun-install:
  cache:
    key:
      prefix: bun-node-modules
      files: [bun.lock]
    paths: [node_modules/.cache/bun/]
  variables:
    BUN_INSTALL_CACHE_DIR: node_modules/.cache/bun
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - bun install --frozen-lockfile

verify:
  stage: verify
  extends: [.bun-install, .on-changes]
  script:
    - bun run build
    - bun run check
    - bun run typecheck
    - bun run knip
    # finish_video needs ffmpeg-static's binary (downloaded by its postinstall)
    - bun --cwd apps/server -e 'const f = (await import("ffmpeg-static")).default; console.log("ffmpeg:", f, await Bun.file(f ?? "").exists())'
    - bun run test

stories:
  stage: verify
  extends: [.bun-install, .on-changes]
  script:
    - bunx playwright install --with-deps chromium
    - bun run test:stories

# Package: the plugin (skills, manifest, logo, mcp.json pointing at
# production) as a zip artifact. The release job builds the versioned zip
# and publishes it to the package registry.
package:plugin:
  stage: package
  extends: .on-changes
  needs: [verify]
  script:
    - apt-get update -qq && apt-get install -y -qq zip >/dev/null
    - VERSION=$(bun -e 'console.log((await Bun.file("plugin/plugin.json").json()).version)')
    - (cd plugin && zip -qr "../wovain-plugin-$VERSION.zip" .)
  artifacts:
    name: wovain-plugin
    paths: [wovain-plugin-*.zip]
    expire_in: 30 days

# Node for the Vercel and Neon CLIs, plus Bun for migrations. Lifecycle
# scripts are skipped: prepare installs git hooks, which CI doesn't need.
.deploy:
  image: node:24-slim
  stage: deploy
  interruptible: false
  before_script:
    - npm install -g --silent "bun@$BUN_VERSION" "$NEONCTL"

deploy:preview:
  extends: .deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    NEON_BRANCH: mr-$CI_MERGE_REQUEST_IID
  script:
    # Each merge request gets its own Neon branch, forked from dev (schema,
    # no production users or tokens) with the MR's migrations applied.
    - neonctl branches get "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY" >/dev/null 2>&1 || neonctl branches create --project-id "$NEON_PROJECT_ID" --name "$NEON_BRANCH" --parent dev --api-key "$NEON_API_KEY" >/dev/null
    - export DATABASE_URL="$(neonctl connection-string "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" --pooled --api-key "$NEON_API_KEY")"
    - bun install --frozen-lockfile --ignore-scripts
    - bun run db:migrate
    - npx --yes "$VERCEL_CLI" deploy --yes --token "$VERCEL_TOKEN" --env DATABASE_URL="$DATABASE_URL" > deploy-url.txt
    - echo "DEPLOY_URL=$(cat deploy-url.txt)" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    url: $DEPLOY_URL
    on_stop: stop:preview
    auto_stop_in: 1 week

# Runs when the merge request closes or the environment is stopped: the
# Neon branch goes; Vercel keeps the deployment until it expires.
stop:preview:
  extends: .deploy
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    GIT_STRATEGY: none
    NEON_BRANCH: mr-$CI_MERGE_REQUEST_IID
  before_script:
    - npm install -g --silent "$NEONCTL"
  script:
    - neonctl branches delete "$NEON_BRANCH" --project-id "$NEON_PROJECT_ID" --api-key "$NEON_API_KEY" || echo "No Neon branch $NEON_BRANCH"
  environment:
    name: review/$CI_MERGE_REQUEST_IID
    action: stop

deploy:production:
  extends: [.deploy, .on-main]
  resource_group: production
  before_script: []
  script:
    - npx --yes "$VERCEL_CLI" deploy --prod --yes --token "$VERCEL_TOKEN"
  environment:
    name: production
    url: https://wovain.vercel.app

# ChatGPT's first steps against the live server: /mcp asks for a token and
# points at the metadata, which names wovain's OAuth server.
smoke:production:
  stage: monitor
  extends: .on-main
  image: curlimages/curl:8.11.1
  needs: [deploy:production]
  variables:
    GIT_STRATEGY: none
    SITE: https://wovain.vercel.app
  script:
    - |
      status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' "$SITE/mcp")
      test "$status" = 401 || { echo "/mcp answered $status, expected 401"; exit 1; }
    - curl -sf "$SITE/.well-known/oauth-protected-resource/mcp" | grep -q "\"resource\":\"$SITE/mcp\""
    - curl -sf "$SITE/.well-known/oauth-authorization-server/api/auth" | grep -q '"code_challenge_methods_supported":\["S256"\]'
    - curl -sf "$SITE/sign-in" | grep -q 'Continue with Google'

# Release only what passed the smoke test: semantic-release reads the
# conventional commits since the last tag, writes the version and
# CHANGELOG.md back to main ([skip ci]), tags, and publishes a GitLab
# release with the plugin zip in the package registry.
release:
  stage: release
  extends: .on-main
  image: node:24-slim
  interruptible: false
  needs: [smoke:production]
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq git zip >/dev/null
    - npm install -g --silent "bun@$BUN_VERSION"
    - bun install --frozen-lockfile --ignore-scripts
  script:
    - npx semantic-release

# Configure: dependency update merge requests, weekly (Mondays 06:00 UTC).
renovate:
  stage: verify
  image:
    name: renovate/renovate:44.138.0
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Renovate dependency updates"
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
    - renovate
