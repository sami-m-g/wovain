# Project review rules for GitLab Duo Code Review, on top of its standard
# review. Duo's merge requests (heal flow, Developer flow) are auto-merged
# only after this review leaves no open threads (apps/ops/src/ops.ts).
# With "GitLab Duo can approve and request changes" on, every thread Duo opens
# also requests changes, which blocks the merge until Duo approves on a
# re-review (the ops job asks for it once the threads are resolved and the
# pipeline is green). Hence the first group: threads only for real problems.
instructions:
  - name: Blocking findings only
    instructions: |
      Every comment you leave blocks the merge until a re-review, so open a
      comment only for a problem that should stop this merge:
      1. Wrong behaviour, a likely runtime error, data loss, or a broken
         contract with a caller, an API or the database.
      2. A security or privacy issue: a leaked secret, a missing auth or
         session check, unvalidated input reaching a query or a shell.
      3. A rule from the groups below.
      4. A claim in documentation or a comment that the diff makes false.
      Don't comment on style, formatting, naming, wording, comment phrasing,
      import order or other preferences: Oxlint and Oxfmt run in CI. Don't
      ask to verify something you can't check from the diff; say what to
      check in the summary instead. When a point is only a suggestion, put
      it in the summary, not in a comment. A point the author already
      answered in a thread reply is settled unless the new diff changes it.

  - name: Heal fixes
    fileFilters:
      - "apps/web/src/**/*.ts"
      - "apps/web/test/**/*.ts"
    instructions: |
      1. A bug fix comes with a test that fails without the fix. For a heal
         merge request, the test name contains "heal <fingerprint>" and
         exercises the real code path, not a copy of it.
      2. Flag fixes that swallow errors (empty catch, catch-and-return-null)
         instead of handling the bad data explicitly.
      3. Flag any change to the fault-injection harness
         (apps/web/src/lib/feature-flags.ts, apps/web/src/lib/checkout/catalog.ts).

  - name: API and data
    fileFilters:
      - "packages/api/src/**/*.ts"
      - "apps/web/src/app/api/**/*.ts"
    instructions: |
      1. Inputs and upstream responses are parsed with zod, not cast with `as`.
      2. Procedures that read or change a merchant's data check the session.
      3. Errors are logged on the request's evlog wide event, not with console.

  - name: No hand-rolling
    fileFilters:
      - "apps/**/*.ts"
      - "apps/**/*.tsx"
      - "packages/**/*.ts"
    instructions: |
      Flag new code that reimplements what an installed dependency or a
      helper already in this repo does. Name the alternative.

  - name: Dependency updates
    fileFilters:
      - "**/package.json"
      - "pnpm-workspace.yaml"
      - "**/pnpm-lock.yaml"
      - ".gitlab-ci.yml"
    instructions: |
      1. Flag a prerelease or branch-snapshot version (for example
         1.0.0-rc.5-ab785fc) that was published before the version it
         replaces; semver ranks it higher, but it is a downgrade.
      2. Flag a packageManager bump without the matching PNPM_VERSION in
         .gitlab-ci.yml, and an @pulumi/pulumi bump without PULUMI_VERSION.
      3. Flag a package.json change whose pnpm-lock.yaml (the root one, or
         infra/'s) isn't in the diff.

  - name: Secrets
    instructions: |
      Flag tokens, API keys, URLs with embedded credentials, or .env files in
      the diff. Only .env.schema files may be committed.
