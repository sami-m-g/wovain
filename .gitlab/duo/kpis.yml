# wovain's product KPIs: what the scout flow (.gitlab/duo/catalog/flows/
# scout.yml) ranks improvement issues against. scout:collect measures each
# one daily (apps/ops/src/scout-collect.ts) and writes the ranked snapshot to
# the "kpi-snapshot" issue. Change a target here and the next run ranks
# against it. Schema: apps/ops/src/kpis.ts.
#
# Sources:
#   metric     Cloud Monitoring; filter is ANDed with service.metrics
#   log-ratio  count(numerator) / count(denominator) of evlog wide events;
#              both are ANDed with service.logs
#   ui         one page load of SITE_URL + page in headless Chromium, mobile
#              viewport: lcp (ms), cls, consoleErrors
#   posthog    a HogQL query on PostHog product analytics (the web app's
#              funnel events, apps/web) whose first row's first column is the
#              value, named `value`; {windowDays} is the window. Each one is
#              also a PostHog insight with an alert, "kpi:<id>", that fires
#              while it misses its target (infra/posthog/kpis.tf), which
#              starts the scout early and verifies shipped fixes
#              (apps/ops/src/signals.ts). Needs POSTHOG_PERSONAL_API_KEY
#              and POSTHOG_PROJECT_ID in CI; without them the optional
#              fallback (a metric or log-ratio source) measures it, or the KPI
#              has no data. Count production events only.
# direction: down means lower is better. weight: 1 (nice) to 5 (critical).

windowDays: 7

service:
  # The web app's own log lines and resource. Keep in sync with the
  # deployment's Cloud Run service name (infra/).
  logs: resource.type="cloud_run_revision" AND resource.labels.service_name="wovain-web" AND jsonPayload.service="wovain-web"
  metrics: resource.type="cloud_run_revision" AND resource.labels.service_name="wovain-web"

# Context for the scout from PostHog, added to the snapshot as tables when
# its keys are set (HogQL; the first row of each names the columns).
posthog:
  context:
    - title: Top pages
      query: >-
        SELECT properties.$pathname AS page, count() AS views, uniq(person_id) AS visitors FROM events WHERE event = '$pageview' AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY GROUP BY page ORDER BY views DESC LIMIT 10
    - title: Rage and dead clicks by page
      query: >-
        SELECT properties.$pathname AS page, countIf(event = '$rageclick') AS rage_clicks, countIf(event = '$dead_click') AS dead_clicks FROM events WHERE event IN ('$rageclick', '$dead_click') AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY GROUP BY page ORDER BY rage_clicks + dead_clicks DESC LIMIT 10
    # Experiments: feature flags named exp-<kpi id> (docs/flows.md). Signed-in
    # merchants exposed to each variant, and how many of them started a run.
    - title: Experiments (flags named exp-*)
      query: >-
        SELECT properties.$feature_flag AS flag, toString(properties.$feature_flag_response) AS variant, uniq(person_id) AS exposed, uniqIf(person_id, person_id IN (SELECT person_id FROM events WHERE event = 'run_started' AND timestamp > now() - INTERVAL {windowDays} DAY)) AS started_a_run FROM events WHERE event = '$feature_flag_called' AND properties.$feature_flag LIKE 'exp-%' AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY GROUP BY flag, variant ORDER BY flag, variant

kpis:
  - id: weekly-visitors
    name: Unique visitors to wovain.com
    why: The top of the funnel; nothing below it grows without visitors.
    unit: visitors
    direction: up
    target: 500
    weight: 3
    source:
      kind: posthog
      query: >-
        SELECT uniq(person_id) AS value FROM events WHERE event = '$pageview' AND properties.environment = 'production' AND properties.bot IS NULL AND properties.internal IS NULL AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: visitor-sign-up-rate
    name: Visitors who sign up
    why: Whether the landing page turns visitors into merchants.
    unit: ratio
    direction: up
    target: 0.05
    weight: 4
    source:
      kind: posthog
      query: >-
        SELECT uniqIf(person_id, event = 'sign_up') / nullIf(uniqIf(person_id, event = '$pageview'), 0) AS value FROM events WHERE properties.environment = 'production' AND properties.bot IS NULL AND properties.internal IS NULL AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: sign-up-to-run
    name: Sign-ups that start a run
    why: Activation; a merchant who never starts a run never sells.
    unit: ratio
    direction: up
    target: 0.5
    weight: 4
    source:
      kind: posthog
      query: >-
        SELECT uniqIf(person_id, event = 'run_started') / nullIf(uniqIf(person_id, event = 'sign_up'), 0) AS value FROM events WHERE properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY
      # Without PostHog: started runs per successful sign-up, from the logs.
      fallback:
        kind: log-ratio
        numerator: jsonPayload.path="/api/rpc/runs/start" AND jsonPayload.status<400
        denominator: jsonPayload.path="/api/auth/sign-up/email" AND jsonPayload.status<400

  - id: run-to-campaign
    name: Merchants whose run reaches a campaign
    why: The whole flow working end to end, from run to design, product and ad.
    unit: ratio
    direction: up
    target: 0.3
    weight: 3
    source:
      kind: posthog
      query: >-
        SELECT uniqIf(person_id, event = 'campaign_created') / nullIf(uniqIf(person_id, event = 'run_started'), 0) AS value FROM events WHERE properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: client-errors
    name: Browser exceptions per 1,000 pageviews
    why: An uncaught error in the browser is usually a broken screen.
    unit: per 1k views
    direction: down
    target: 5
    weight: 4
    source:
      kind: posthog
      query: >-
        SELECT countIf(event = '$exception') * 1000 / nullIf(countIf(event = '$pageview'), 0) AS value FROM events WHERE event IN ('$exception', '$pageview') AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: frustrated-clicks
    name: Rage and dead clicks per 1,000 pageviews
    why: Clicks that do nothing, or repeated in anger, mark UI that misleads.
    unit: per 1k views
    direction: down
    target: 10
    weight: 2
    source:
      kind: posthog
      query: >-
        SELECT countIf(event IN ('$rageclick', '$dead_click')) * 1000 / nullIf(countIf(event = '$pageview'), 0) AS value FROM events WHERE event IN ('$rageclick', '$dead_click', '$pageview') AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: field-lcp
    name: Largest Contentful Paint p75 from real visits
    why: Field data, unlike home-lcp's one lab load; "good" is 2.5 s or less.
    unit: ms
    direction: down
    target: 2500
    weight: 3
    source:
      kind: posthog
      query: >-
        SELECT quantile(0.75)(toFloat(properties.$web_vitals_LCP_value)) AS value FROM events WHERE event = '$web_vitals' AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: merchant-rating
    name: Run rating from merchants (1 to 5)
    why: What merchants say about a run, from the "Run rating" survey.
    unit: stars
    direction: up
    target: 4
    weight: 3
    source:
      kind: posthog
      query: >-
        SELECT avg(toFloat(properties.$survey_response_rating)) AS value FROM events WHERE event = 'survey sent' AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: llm-cost-per-run
    name: Nemotron cost per run
    why: Model spend per run, from PostHog LLM analytics at Nebius list prices.
    unit: USD
    direction: down
    target: 0.02
    weight: 2
    source:
      kind: posthog
      query: >-
        SELECT sum(toFloat(properties.$ai_total_cost_usd)) / nullIf(uniq(properties.$ai_trace_id), 0) AS value FROM events WHERE event = '$ai_generation' AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  # The next three guard against small samples: each query returns 1 (on
  # target) until enough merchants or runs exist, so they stay quiet at low
  # volume. Their windows are part of the definition, not {windowDays}.
  - id: activation-cohort
    name: Last week's sign-ups that started a run
    why: Activation of a matured cohort (sign-ups 7 to 14 days old), the North Star's input; guarded at fewer than 5 sign-ups.
    unit: ratio
    direction: up
    target: 0.25
    weight: 4
    source:
      kind: posthog
      query: >-
        SELECT if(count() < 5, 1, countIf(person_id IN (SELECT person_id FROM events WHERE event = 'run_started' AND properties.environment = 'production' AND timestamp > now() - INTERVAL 14 DAY)) / count()) AS value FROM (SELECT person_id FROM events WHERE event = 'sign_up' AND properties.environment = 'production' AND timestamp >= now() - INTERVAL 14 DAY AND timestamp < now() - INTERVAL 7 DAY GROUP BY person_id)

  - id: run-success-rate
    name: Runs that succeed (last 24 hours)
    why: A failed run is a merchant who got nothing; run_completed over run_completed plus run_failed, guarded at fewer than 10 runs.
    unit: ratio
    direction: up
    target: 0.9
    weight: 5
    source:
      kind: posthog
      query: >-
        SELECT if(count() < 10, 1, countIf(event = 'run_completed') / count()) AS value FROM events WHERE event IN ('run_completed', 'run_failed') AND properties.environment = 'production' AND timestamp > now() - INTERVAL 24 HOUR

  - id: design-approval-rate
    name: Merchants who approve a design after starting a run
    why: Agent quality; a run whose designs nobody approves produced nothing. Guarded at fewer than 5 merchants.
    unit: ratio
    direction: up
    target: 0.3
    weight: 4
    source:
      kind: posthog
      query: >-
        SELECT if(uniqIf(person_id, event = 'run_started') < 5, 1, uniqIf(person_id, event = 'design_approved') / uniqIf(person_id, event = 'run_started')) AS value FROM events WHERE event IN ('run_started', 'design_approved') AND properties.environment = 'production' AND timestamp > now() - INTERVAL {windowDays} DAY

  - id: server-error-rate
    name: API server error rate
    why: Each 5xx is a merchant whose action failed.
    unit: ratio
    direction: down
    target: 0.005
    weight: 5
    source:
      kind: log-ratio
      numerator: jsonPayload.status>=500
      denominator: jsonPayload.status>=100

  - id: checkout-quote-success
    name: Checkout quotes that succeed
    why: A failed quote is a lost order.
    unit: ratio
    direction: up
    target: 0.99
    weight: 5
    source:
      kind: log-ratio
      numerator: jsonPayload.path="/api/checkout/quote" AND jsonPayload.status<400
      denominator: jsonPayload.path="/api/checkout/quote"

  - id: sign-up-success
    name: Sign-ups that succeed
    why: The top of the merchant funnel; a failed sign-up rarely retries.
    unit: ratio
    direction: up
    target: 0.9
    weight: 4
    source:
      kind: log-ratio
      numerator: jsonPayload.path="/api/auth/sign-up/email" AND jsonPayload.status<400
      denominator: jsonPayload.path="/api/auth/sign-up/email"

  - id: p95-latency
    name: p95 request latency
    why: Slow responses lose merchants mid-task.
    unit: ms
    direction: down
    target: 800
    weight: 3
    source:
      kind: metric
      filter: metric.type="run.googleapis.com/request_latencies"
      aligner: ALIGN_PERCENTILE_95
      reducer: REDUCE_MAX

  - id: home-lcp
    name: Home page Largest Contentful Paint (mobile)
    why: First impression; Core Web Vitals' "good" is 2.5 s or less.
    unit: ms
    direction: down
    target: 2500
    weight: 3
    source:
      kind: ui
      page: /
      measure: lcp

  - id: login-cls
    name: Login page layout shift (mobile)
    why: Shifting forms cause mis-taps; Core Web Vitals' "good" is 0.1 or less.
    unit: score
    direction: down
    target: 0.1
    weight: 2
    source:
      kind: ui
      page: /login
      measure: cls

  - id: login-console-errors
    name: Console errors on the login page
    why: Client errors usually mean a broken interaction.
    unit: errors
    direction: down
    target: 0
    weight: 2
    source:
      kind: ui
      page: /login
      measure: consoleErrors
