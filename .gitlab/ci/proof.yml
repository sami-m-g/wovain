# Proof of the whole journey: an MCP client drives every step against the
# server on the emulators with recorded Fourthwall, fal, Meta, Tavily, Qloo
# and Nebius replies (apps/server/test/e2e), then Playwright draws each
# step's widget from its real result into e2e-report/index.html, and the
# demo renders e2e-report/demo.mp4 from the same run (the /demo skill).

# Playwright's image ships Chromium (its tag matches apps/widgets' playwright);
# the emulators need Java 21. Install scripts are skipped, so ffmpeg-static's
# binary is fetched here.
.proof:
  extends: [.pnpm-install]
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  before_script:
    - apt-get update -qq && apt-get install -y -qq openjdk-21-jre-headless espeak-ng >/dev/null
    - !reference [.pnpm-install, before_script]
    - pnpm --filter @wovain/widgets rebuild ffmpeg-static

e2e:
  stage: verify
  extends: [.proof, .on-changes]
  script:
    - pnpm test:e2e
  artifacts:
    when: always
    expose_as: e2e proof report
    paths: [e2e-report/]
    expire_in: 30 days

# Narration is espeak-ng here: CI has no fal key, and the operator's stays
# on their machine (`/demo` locally uses it).
demo:
  stage: verify
  extends: [.proof, .on-changes]
  needs: [e2e]
  script:
    - pnpm demo
  artifacts:
    expose_as: demo video
    paths: [e2e-report/demo.mp4]
    expire_in: 30 days

# The latest main report and demo on GitLab Pages.
pages:
  stage: deploy
  extends: .on-main
  image: alpine:3.22
  needs: [e2e, demo]
  variables:
    GIT_STRATEGY: none
  script:
    - mv e2e-report public
  artifacts:
    paths: [public]

# Nightly on main: the same journey with real Tavily and Nebius calls, capped
# small, when their keys are set (infra/index.ts, protected and masked).
e2e:live:
  stage: verify
  extends: [.proof]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Nightly e2e"
  variables:
    E2E_LIVE: "1"
  script:
    - pnpm test:e2e
  artifacts:
    when: always
    paths: [e2e-report/]
    expire_in: 14 days
