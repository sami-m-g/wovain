# ChatGPT's first steps against the live server: /mcp asks for a token and
# points at the metadata, which names AuthKit; AuthKit offers CIMD.
smoke:production:
  stage: monitor
  extends: .on-main
  image: curlimages/curl:8.11.1
  needs: [deploy:production]
  variables:
    GIT_STRATEGY: none
    SITE: $SITE_URL
  script:
    - |
      status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' "$SITE/mcp")
      test "$status" = 401 || { echo "/mcp answered $status, expected 401"; exit 1; }
    - curl -sf "$SITE/.well-known/oauth-protected-resource/mcp" > resource.json
    - grep -q "\"resource\":\"$SITE/mcp\"" resource.json
    - AUTHKIT=$(sed -n 's/.*"authorization_servers":\["\([^"]*\)".*/\1/p' resource.json)
    - test -n "$AUTHKIT" || { echo "no authorization server in the metadata"; exit 1; }
    - curl -sf "$AUTHKIT/.well-known/oauth-authorization-server" | grep -q '"client_id_metadata_document_supported":true'
