# PostHog configuration as code (infra/posthog, docs/flows.md): KPI insights
# and alerts from .gitlab/duo/kpis.yml, the "wovain health" dashboard, the
# destinations that start the ops pipeline and the run-rating survey. GitLab's
# OpenTofu component runs it with GitLab-managed state "posthog". Merge
# requests validate it; main plans it with the protected PostHog key and a
# person applies the plan (Run on posthog:apply). Nothing changes PostHog
# without that click.

.posthog-tofu:
  variables:
    TF_VAR_posthog_api_key: $POSTHOG_PERSONAL_API_KEY
    TF_VAR_posthog_project_id: $POSTHOG_PROJECT_ID
    TF_VAR_gitlab_api: $CI_API_V4_URL
    TF_VAR_gitlab_project_id: $CI_PROJECT_ID
    TF_VAR_gitlab_trigger_token: $POSTHOG_TRIGGER_TOKEN
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $OPS || $SCOUT
      when: never
    - changes:
        [infra/posthog/**/*, .gitlab/duo/kpis.yml, .gitlab/ci/posthog.yml]

posthog:validate:
  extends: [.opentofu:validate, .posthog-tofu]
  needs: []

posthog:plan:
  extends: [.opentofu:plan, .posthog-tofu]
  needs: [posthog:validate]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $OPS || $SCOUT
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $POSTHOG_PERSONAL_API_KEY && $POSTHOG_TRIGGER_TOKEN
      changes:
        [infra/posthog/**/*, .gitlab/duo/kpis.yml, .gitlab/ci/posthog.yml]

posthog:apply:
  extends: [.opentofu:apply, .posthog-tofu]
  needs: [posthog:plan]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $OPS || $SCOUT
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $POSTHOG_PERSONAL_API_KEY && $POSTHOG_TRIGGER_TOKEN
      changes:
        [infra/posthog/**/*, .gitlab/duo/kpis.yml, .gitlab/ci/posthog.yml]
      when: manual
