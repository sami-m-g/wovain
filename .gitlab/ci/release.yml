# Release only what passed the smoke test: semantic-release reads the
# conventional commits since the last tag, writes the version and
# CHANGELOG.md back to main ([skip ci]), tags, and publishes a GitLab
# release.
release:
  stage: release
  extends: .on-main
  image: node:24-slim
  interruptible: false
  needs: [smoke:production]
  variables:
    GIT_DEPTH: 0
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - !reference [.pnpm-install, before_script]
  script:
    - pnpm exec semantic-release

# Keep the GitHub mirror on GitLab's main, including the [skip ci] release
# commit and its tag, which land after this pipeline started. Runs even when
# an earlier job failed, since the mirror should match GitLab either way.
mirror:github:
  stage: .post
  image: alpine:3.21
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache -q git openssh-client
    - !reference [.github-ssh, before_script]
  script:
    - git fetch -q origin main --tags
    - git push git@github.com:sami-m-g/wovain.git refs/remotes/origin/main:refs/heads/main --tags
