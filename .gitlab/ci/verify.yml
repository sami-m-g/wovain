# Lint and format (Ultracite), types, dead code (knip) and tests, on every
# push and merge request, with the build placeholders (templates.yml).
verify:
  stage: verify
  extends: [.pnpm-install, .on-changes, .env-placeholders]
  script:
    - pnpm run check
    - pnpm run check-types
    - pnpm run knip
    - pnpm run test
  artifacts:
    when: always
    reports:
      junit: "**/junit.xml"

# infra/ type-checks against the SDKs `pulumi install` generates, and its
# programs run against mocks with no credentials (infra/*.test.ts): missing
# config, code that throws and dynamic providers that don't serialize fail
# here instead of in `pulumi up`.
verify:infra:
  stage: verify
  extends: [.pulumi-install, .on-changes]
  rules:
    - !reference [.not-ops, rules]
    - changes: [infra/**/*, .gitlab/duo/catalog/**/*]
  script:
    - pnpm --dir infra run check-types
    - pnpm --dir infra run test

# The plan for a merge request, against the real stack and with the policy
# pack, as gitlab-preview: read-only, and trusted only from this project's
# merge request pipelines (infra/bootstrap). No --refresh, which would read
# secret values; main's job refreshes and previews again before it applies.
infra:preview:
  stage: verify
  extends: [.pulumi-install, .pulumi-preview]
  rules:
    # Once main has created the preview identity's variables (infra/README.md).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $GCP_PREVIEW_SERVICE_ACCOUNT
      changes: [infra/**/*, .gitlab/duo/catalog/**/*]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_PREVIEW_SERVICE_ACCOUNT
    GCP_WORKLOAD_IDENTITY_PROVIDER: $GCP_PREVIEW_WORKLOAD_IDENTITY_PROVIDER
  before_script:
    - !reference [.pulumi-install, before_script]
    - !reference [.gcp-credentials, before_script]

# The turbo build of every app.
build:
  stage: verify
  extends: [.pnpm-install, .on-changes, .env-placeholders]
  script:
    - pnpm run build

# Configure: dependency update merge requests, weekly (Mondays 06:00 UTC),
# from renovate-runner's job (included in .gitlab-ci.yml; it reads
# RENOVATE_TOKEN and sets the platform and endpoint). Its rule matches every
# schedule; this one keeps it off the ops and scout schedules. Its resource
# group is "production", the deploy jobs', so it gets its own.
renovate:
  stage: verify
  resource_group: renovate
  image:
    name: renovate/renovate:44.138.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Renovate dependency updates"
  variables:
    GIT_STRATEGY: none
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info

# The production Dockerfiles, built (not pushed) on every merge request, so an
# image that can't build never reaches main.
image:check:
  stage: verify
  extends: .env-placeholders
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  parallel:
    matrix:
      - DOCKERFILE: apps/web/Dockerfile
        BUILD_SECRET: web_env
      - DOCKERFILE: apps/fumadocs/Dockerfile
        BUILD_SECRET: docs_env
  script:
    - !reference [.image-env, script]
    - docker build -f "$DOCKERFILE" --secret "id=$BUILD_SECRET,src=/tmp/$BUILD_SECRET" .

# Keeps GitHub's main and tags equal to GitLab's, over the deploy key from
# infra/github.ts. A plain push, never --force: if GitHub's main isn't an
# ancestor of GitLab's, the push is rejected and the job fails for a human.
mirror:github:
  extends: [.on-main]
  # After deploy: infra:production creates the deploy key this job uses, and
  # a failed mirror must never hold back a deploy.
  stage: .post
  allow_failure: true
  image: alpine:3.21
  interruptible: false
  resource_group: github-mirror
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache -q git openssh-client
    - !reference [.github-ssh, before_script]
  script:
    - git fetch -q origin main --tags
    - git push git@github.com:sami-m-g/wovain.git refs/remotes/origin/main:refs/heads/main --tags
