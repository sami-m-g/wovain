# Lint and format (Ultracite), types, dead code (knip) and tests, on every
# push and merge request.
verify:
  stage: verify
  extends: [.pnpm-install, .on-changes]
  script:
    - pnpm run check
    - pnpm run check-types
    - pnpm run knip
    - pnpm run --if-present test

# infra/ type-checks against the SDKs `pulumi install` generates.
verify:infra:
  stage: verify
  extends: [.pulumi-install, .on-changes]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [infra/**/*]
  script:
    - pnpm --dir infra run check-types

# The turbo build of every app. Varlock validates env at build time, so the
# build gets placeholders; real values only exist at runtime (Cloud Run).
build:
  stage: verify
  extends: [.pnpm-install, .on-changes]
  variables:
    BETTER_AUTH_SECRET: ci-build-placeholder-never-used-at-runtime
    BETTER_AUTH_URL: http://localhost:3001
    DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    NODE_ENV: production
  script:
    - pnpm run build

# Configure: dependency update merge requests, weekly (Mondays 06:00 UTC).
renovate:
  stage: verify
  image:
    name: renovate/renovate:44.138.0
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Renovate dependency updates"
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
    - renovate
