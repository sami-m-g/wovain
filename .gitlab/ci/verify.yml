# Lint and format (Ultracite), types, dead code (knip) and tests, on every
# push and merge request.
# Varlock validates env when Next loads its config (typegen and build), so
# these jobs get placeholders; real values only exist at runtime (Cloud Run).
.env-placeholders:
  variables:
    BETTER_AUTH_SECRET: ci-build-placeholder-never-used-at-runtime
    BETTER_AUTH_URL: http://localhost:3001
    DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    TOKEN_ENCRYPTION_KEY: YnVpbGQtcGxhY2Vob2xkZXItbm90LWEtcmVhbC1rZXk=

verify:
  stage: verify
  extends: [.pnpm-install, .on-changes, .env-placeholders]
  script:
    - pnpm run check
    - pnpm run check-types
    - pnpm run knip
    - pnpm run test
  artifacts:
    when: always
    reports:
      junit: "**/junit.xml"

# infra/ type-checks against the SDKs `pulumi install` generates.
verify:infra:
  stage: verify
  extends: [.pulumi-install, .on-changes]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $OPS || $SCOUT
      when: never
    - changes: [infra/**/*]
  script:
    - pnpm --dir infra run check-types

# The turbo build of every app.
build:
  stage: verify
  extends: [.pnpm-install, .on-changes, .env-placeholders]
  script:
    - pnpm run build

# Configure: dependency update merge requests, weekly (Mondays 06:00 UTC).
renovate:
  stage: verify
  image:
    name: renovate/renovate:44.138.0
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "Renovate dependency updates"
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    LOG_LEVEL: info
  script:
    - renovate
