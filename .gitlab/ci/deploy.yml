# main only, in order: infrastructure, the images (package), the database
# schema, the rollout, then a smoke test. Every Google call goes through
# Workload Identity Federation (templates.yml); no Google key is stored.
#   wovain.com       apps/web        Cloud Run wovain-web
#   docs.wovain.com  apps/fumadocs   Cloud Run wovain-docs

# A pipeline for a commit that is no longer main's HEAD must not deploy: with
# the resource groups on newest_ready_first (AGENTS.md), a superseded
# pipeline's job can still reach the lock after the newer one, and would roll
# older code over it. Each job that deploys starts with this check and ends
# successfully, doing nothing, when main has moved on. It fails open if the
# API can't be read. DEPLOY_STALE=1 (Run pipeline) forces an old commit out.
# canary:production doesn't use it: it deploys nothing, and must always
# promote or roll back the canary that deploy:production already put at 10%,
# even when main has moved on in between; skipping would leave it unresolved.
.skip-if-superseded:
  script:
    - |
      # The gcloud image has no curl, so fall back to python3 (docker and
      # node images have curl or install it).
      url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/commits/$CI_DEFAULT_BRANCH"
      if command -v curl >/dev/null; then
        body=$(curl -fsS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$url" || true)
      else
        body=$(python3 -c 'import os,sys,urllib.request as u; print(u.urlopen(u.Request(sys.argv[1], headers={"PRIVATE-TOKEN": os.environ["GITLAB_TOKEN"]}), timeout=20).read().decode())' "$url" || true)
      fi
      head=$(printf '%s' "$body" | sed -n 's/^{"id":"\([0-9a-f]\{40\}\)".*/\1/p')
      if [ -n "$head" ] && [ "$head" != "$CI_COMMIT_SHA" ] && [ -z "$DEPLOY_STALE" ]; then
        echo "Superseded: $CI_COMMIT_SHA is not $CI_DEFAULT_BRANCH's head ($head); skipping."
        exit 0
      fi

# `pulumi up` applies infra/ (state in gs://wovain-pulumi-state) as
# gitlab-infra, after the same guarded preview as the merge request's
# (verify.yml, infra/README.md), so a plan that would fail stops before any
# change. --refresh first reads the live Cloud Run images, which CI owns and
# Pulumi ignores, so a settings change never rolls an image back. No
# --continue-on-error: the first error stops the update.
infra:production:
  extends: [.gcp-auth, .on-main, .pulumi-preview]
  stage: deploy
  interruptible: false
  resource_group: infra
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_INFRA_SERVICE_ACCOUNT
    PREVIEW_FLAGS: --refresh
  before_script:
    - !reference [.pulumi-install, before_script]
    - !reference [.gcp-credentials, before_script]
  script:
    - !reference [.skip-if-superseded, script]
    - !reference [.pulumi-preview, script]
    - pulumi up --cwd infra --stack prod --refresh --policy-pack "$CI_PROJECT_DIR/infra/policy" --yes --non-interactive
  # Google trusts gitlab-infra only for jobs in this environment.
  environment:
    name: infrastructure
    deployment_tier: other

# Package: builds an app's Dockerfile (turbo prune, Next.js standalone) with
# BuildKit and pushes it to the GitLab container registry, where Container
# Scanning reads it (secure.yml), and to Artifact Registry, where Cloud Run
# pulls it, as gitlab-deploy. Varlock validates env while Next builds, so the
# build gets an env file (templates.yml, .image-env): placeholders for the web
# app's secrets (Cloud Run supplies the real ones) and the public values that
# are compiled in.
.image:
  extends: [.gcp-auth, .on-main, .env-placeholders]
  stage: deploy
  image: docker:28
  services:
    - docker:28-dind
  interruptible: false
  needs: [infra:production]
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_DEPLOY_SERVICE_ACCOUNT
    DOCKER_TLS_CERTDIR: /certs
  before_script:
    - apk add --no-cache curl
    - !reference [.gcp-token, before_script]
    - echo "$GCP_ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$GCP_REGION-docker.pkg.dev"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - !reference [.skip-if-superseded, script]
    - !reference [.image-env, script]
    - docker build -f "$DOCKERFILE" --secret "id=$BUILD_SECRET,src=/tmp/$BUILD_SECRET" -t "$GCP_IMAGE_REPOSITORY/$APP:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/$APP:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/$APP:latest" .
    - docker push "$GCP_IMAGE_REPOSITORY/$APP:$CI_COMMIT_SHA"
    - docker push --all-tags "$CI_REGISTRY_IMAGE/$APP"
  environment:
    name: production
    action: prepare

image:web:
  extends: .image
  variables:
    APP: web
    DOCKERFILE: apps/web/Dockerfile
    BUILD_SECRET: web_env

image:docs:
  extends: .image
  variables:
    APP: docs
    DOCKERFILE: apps/fumadocs/Dockerfile
    BUILD_SECRET: docs_env

# Applies packages/db's Drizzle migrations, then Mastra's storage schema, to
# Cloud SQL. cloud-sql-proxy makes the same /cloudsql/<instance> socket
# Cloud Run mounts, so the DATABASE_URL secret works as is. GitLab reads that secret from Secret
# Manager with the job's own token (GCP_PROJECT_NUMBER and the
# GCP_WORKLOAD_IDENTITY_FEDERATION_* variables; infra/index.ts grants each
# environment its own database's URL).
migrate:production:
  extends: [.gcp-auth, .on-main]
  stage: deploy
  interruptible: false
  resource_group: production
  needs: [image:web]
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_DEPLOY_SERVICE_ACCOUNT
    CLOUD_SQL_PROXY_VERSION: v2.14.0
  secrets:
    DATABASE_URL:
      gcp_secret_manager:
        name: database-url
      token: $GITLAB_OIDC_TOKEN
      file: false
  before_script:
    - !reference [.pnpm-install, before_script]
    - !reference [.gcp-credentials, before_script]
  script:
    - !reference [.skip-if-superseded, script]
    - curl -fsSL -o /usr/local/bin/cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$CLOUD_SQL_PROXY_VERSION/cloud-sql-proxy.linux.amd64"
    - chmod +x /usr/local/bin/cloud-sql-proxy
    - mkdir -p /cloudsql
    - cloud-sql-proxy --unix-socket /cloudsql --health-check "$GCP_SQL_INSTANCE" &
    - cloud-sql-proxy wait --max 30s
    - pnpm --filter @wovain/db exec drizzle-kit migrate
    # Mastra's own schema (memory, workflow snapshots, scores), created by
    # Mastra's init: the app's store never runs DDL (workflows/storage.ts).
    - pnpm --filter @wovain/api run storage:init
  environment:
    name: production
    action: prepare

# Rolls each image out as a new Cloud Run revision; Pulumi owns every other
# setting of the services (infra/index.ts) but not their traffic. The web
# app goes out as a canary (docs/adr/0001-progressive-delivery.md): a
# revision with no traffic and the `canary` tag, then CANARY_PERCENT of
# production; canary:production promotes it or rolls it back. The docs site
# goes straight to 100%.
# CANARY_DEMO_FAULT=1 (Run pipeline on main) makes the canary revision fail
# its checkout quotes (FAULT_INJECTION_REVISION, apps/web), the demo's bad
# deploy; every other deploy clears it.
deploy:production:
  # .gcloud last, so its before_script (credentials, then gcloud) wins.
  extends: [.gcp-auth, .gcloud, .on-main]
  stage: deploy
  interruptible: false
  resource_group: production
  needs: [image:web, image:docs, migrate:production]
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_DEPLOY_SERVICE_ACCOUNT
    CANARY_PERCENT: "10"
  script:
    - !reference [.skip-if-superseded, script]
    - |
      if [ -n "$CANARY_DEMO_FAULT" ]; then
        fault=--update-env-vars=FAULT_INJECTION_REVISION=checkout
      else
        fault=--remove-env-vars=FAULT_INJECTION_REVISION
      fi
    - gcloud run deploy wovain-web --image "$GCP_IMAGE_REPOSITORY/web:$CI_COMMIT_SHA" --region "$GCP_REGION" --no-traffic --tag canary "$fault" --quiet
    - gcloud run services update-traffic wovain-web --region "$GCP_REGION" --to-tags "canary=$CANARY_PERCENT" --quiet
    - gcloud run deploy wovain-docs --image "$GCP_IMAGE_REPOSITORY/docs:$CI_COMMIT_SHA" --region "$GCP_REGION" --quiet
  environment:
    name: production
    url: $SITE_URL

# dev.wovain.com (infra/dev.ts), by hand from main: the commit's web image,
# already built and pushed after infra:production applied its guarded plan,
# migrates wovain_dev and rolls out to wovain-web-dev. Same account as
# production, trusted from the development environment.
.on-main-manual:
  rules:
    - !reference [.not-ops, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true

migrate:development:
  extends: [migrate:production, .on-main-manual]
  resource_group: development
  secrets:
    DATABASE_URL:
      gcp_secret_manager:
        name: database-url-dev
  environment:
    name: development
    action: prepare

deploy:development:
  extends: [.gcp-auth, .gcloud, .on-main]
  stage: deploy
  interruptible: false
  resource_group: development
  needs: [migrate:development]
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_DEPLOY_SERVICE_ACCOUNT
  script:
    - !reference [.skip-if-superseded, script]
    - gcloud run deploy wovain-web-dev --image "$GCP_IMAGE_REPOSITORY/web:$CI_COMMIT_SHA" --region "$GCP_REGION" --quiet
  environment:
    name: development
    url: $DEV_SITE_URL

# The canary verdict (apps/ops/src/canary.ts): probes the canary's tag URL
# and counts each revision's 5xx responses for CANARY_WINDOW_S (5 minutes),
# then sends 100% to the canary or back to the stable revision and files a
# release-guard issue for the wovain release-guard Duo flow. It holds the
# production resource group, so the next deploy waits for the verdict. A
# rollback fails the job, so the pipeline (and DORA's change failure rate)
# shows it. canary.md is the audit trail.
.release-job:
  extends: .ops-job
  interruptible: false
  resource_group: production
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_DEPLOY_SERVICE_ACCOUNT
  # Google trusts gitlab-deploy only from this environment; verify records
  # no deployment.
  environment:
    name: production
    action: verify
  artifacts:
    when: always
    expose_as: canary verdict
    paths: [canary.md]

canary:production:
  extends: [.release-job, .on-main]
  needs: [deploy:production]
  script:
    - pnpm --dir apps/ops run canary verify

# The release guard's traffic rollback: the ops job (a person's token)
# starts a pipeline on main with ROLLBACK=1 when production degrades after a
# deploy and no flag change explains it (apps/ops/src/release.ts). ROLLBACK_TO
# names the revision; without it, the newest ready one before the current.
rollback:production:
  extends: .release-job
  rules:
    - if: ($CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web") && $ROLLBACK && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs: []
  script:
    - pnpm --dir apps/ops run canary rollback

# The synthetic checks (apps/ops/src/smoke.ts), as a visitor with no
# account: /login shows Google, a sign-in for an address that can't exist is
# a 401 and not a 5xx, connect links and callback errors redirect on
# wovain.com, /api/inngest answers, the docs chat isn't down. A failure goes
# to PostHog Error Tracking, where heal and the release guard read it, and
# fails the job. The ops job runs the same checks every 10 minutes.
smoke:production:
  extends: .on-main
  stage: monitor
  needs: [deploy:production]
  before_script:
    - npm install -g --silent "pnpm@$PNPM_VERSION"
    - pnpm install --frozen-lockfile --ignore-scripts --filter @wovain/ops
  script:
    - pnpm --dir apps/ops run smoke

# Registers the new revision's run workflow with Inngest Cloud
# (docs/adr/0001-durable-runs.md): a PUT to the serve route syncs the app, so
# no one syncs it by hand in the Inngest dashboard. It fails until the
# inngest-event-key and inngest-signing-key secrets are set.
sync:inngest:
  extends: .on-main
  stage: monitor
  image: curlimages/curl:8.11.1
  needs: [deploy:production]
  allow_failure: true
  variables:
    GIT_STRATEGY: none
  script:
    - curl -sSf -X PUT "$SITE_URL/api/inngest"
