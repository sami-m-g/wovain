# Flow 2, scout (docs/flows.md), daily on the "wovain scout" schedule or now
# with Run pipeline and SCOUT=1.

# Measures every KPI in .gitlab/duo/kpis.yml (Cloud Monitoring, Cloud
# Logging, the live site in headless Chromium) and writes the ranked
# snapshot to the "kpi-snapshot" issue (apps/ops/src/scout-collect.ts).
scout:collect:
  extends: .ops-job
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "wovain scout"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCOUT
  script:
    - pnpm --filter @wovain/ops exec playwright install --with-deps chromium
    - node apps/ops/src/scout-collect.ts
  artifacts:
    when: always
    paths: [scout/]
    expire_in: 30 days

# Starts the scout flow. Its trigger (infra/duo.ts) fires only on a
# successful parent_pipeline pipeline on main, which only this job creates.
# A scheduled Duo trigger needs a service account the hackathon role can't
# create, and a mention trigger would let anyone who comments steer it.
scout:duo:
  stage: monitor
  needs: [scout:collect]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "wovain scout"
    - if: ($CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api") && $SCOUT
  trigger:
    include: .gitlab/ci/scout-signal.yml
