# The self-healing loop (docs/loop.md), hourly on the "wovain loop" pipeline
# schedule (infra/gitlab.ts). apps/ops/src/loop.ts verifies merged fixes
# against production's error rate, files new production errors as issues for
# the Duo Developer flow, and moves Duo's merge requests through Duo Code
# Review to GitLab's auto-merge. It reads Google Cloud as gitlab-ops (logs
# and metrics only), which trusts only jobs in the operations environment.
# The scanners stay on for it, as for every pipeline: schedule variables need
# a role we don't have.
loop:
  extends: .ops-job
  resource_group: loop
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "wovain loop"
  script:
    - node apps/ops/src/loop.ts

# Weekly, on the "wovain weekly" schedule: the data analysis (funnel from
# merchants' records, usage and costs) goes to the digest issue, and the
# market scout files one intent from competitors' news and the biggest
# funnel drop-off (apps/ops/src/weekly.ts). 3 Tavily searches, no model call.
# It's the only job that reads merchants' records (counts only), so it signs
# in as gitlab-analytics from its own environment; loop and sci can't.
weekly:
  extends: .ops-job
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "wovain weekly"
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_ANALYTICS_SERVICE_ACCOUNT
  script:
    - node apps/ops/src/weekly.ts
  environment:
    name: analytics
    action: verify

# Starts the Duo scout flow once a week. Its flow trigger (infra/duo.ts,
# wovain:duoCustomFlows) fires only on a successful parent_pipeline pipeline
# on main, which nothing else in this project creates. A mention trigger would
# let anyone who comments steer it, and a scheduled one needs a service
# account our role can't create. The child runs one empty job.
scout:duo:
  stage: monitor
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION == "wovain weekly"
  needs: [weekly]
  trigger:
    include: .gitlab/ci/scout-signal.yml

# Software Carbon Intensity on every main pipeline (apps/ops/src/sci.ts,
# docs/sustainability.md): the last 7 days of Cloud Run instance time and
# requests and of main pipelines' CI time. The report is a job artifact
# (latest: /-/jobs/artifacts/main/raw/sci-report.md?job=sci) and a GitLab
# metrics report.
sci:
  extends: [.ops-job, .on-main]
  stage: .post
  needs: []
  script:
    - node apps/ops/src/sci-report.ts
  artifacts:
    expose_as: SCI report
    paths: [sci-report.md, sci.json]
    reports:
      metrics: metrics.txt
    expire_in: 90 days
