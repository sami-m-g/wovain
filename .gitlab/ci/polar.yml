# Polar catalog as code (packages/billing/src/plans.ts): the credits meter,
# the meter-credit benefits and the products. Polar has no official
# Terraform or OpenTofu provider, so `pnpm polar:seed` applies plans.ts with
# the official SDK, idempotently. Like posthog:apply, it runs on main only,
# by hand (Run on polar:seed), with the protected token Pulumi sets.
# Paid plans and the pack stay archived in Polar until POLAR_PAID_PLANS=on
# (set it as a CI variable when the billing-paid-plans flag goes on).
# It also keeps the webhook endpoint for $SITE_URL: when it creates the
# endpoint, or finds Secret Manager without its secret, it writes the signing
# secret straight to polar-webhook-secret as a new version (never printed),
# as gitlab-infra.
# Promo codes (packages/billing/src/promos.ts) are applied the same way: a
# promo's first run makes a random code in Polar and writes it only to
# Secret Manager (polar-promo-<id>). The repository and its job logs are
# public, so no code is ever printed; set POLAR_PROMO_CODE_<ID> (masked,
# protected) to choose a code instead.

polar:seed:
  extends: [.gcp-auth, .pnpm-install, .env-placeholders]
  stage: deploy
  needs: []
  interruptible: false
  resource_group: infra
  variables:
    GCP_SERVICE_ACCOUNT: $GCP_INFRA_SERVICE_ACCOUNT
    POLAR_WEBHOOK_URL: $SITE_URL/api/auth/polar/webhooks
  before_script:
    - !reference [.gcp-credentials, before_script]
    - !reference [.pnpm-install, before_script]
  # Google trusts gitlab-infra only for jobs in this environment.
  environment:
    name: infrastructure
    deployment_tier: other
  rules:
    - !reference [.not-ops, rules]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $POLAR_ACCESS_TOKEN
      changes:
        - packages/billing/src/plans.ts
        - packages/billing/src/promos.ts
        - packages/billing/src/seed.ts
        - .gitlab/ci/polar.yml
      when: manual
  script:
    - pnpm polar:seed
