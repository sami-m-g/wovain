packages:
  - apps/*
  - packages/*

# Which dependencies may run install scripts. re2 is an optional native
# speed-up for the Firebase CLI's hosting emulator, which wovain doesn't use.
allowBuilds:
  "@firebase/util": false
  esbuild: true
  # The demo video's ffmpeg binary (apps/widgets/proof/demo.ts).
  ffmpeg-static: true
  lefthook: true
  protobufjs: false
  re2: false
