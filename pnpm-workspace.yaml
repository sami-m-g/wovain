packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  sharp: true
  lefthook: true
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  protobufjs: false
overrides:
  "@next/env": npm:@varlock/nextjs-integration@1.2.5
  # geoip-country pins ip-address 6.x (GHSA-mwp4-54f8-5fhr, high, and others);
  # it does not import it at runtime. Remove once geoip-country moves to 10.x.
  ip-address: ^10.7.4
  # @hono/node-ws (via mastra's deployer) peers on @hono/node-server 1.x, and
  # every 1.x from 1.19.10 has GHSA-rmxm-3fg6-px4f (no 1.x fix). node-ws does not
  # import node-server at runtime, and the deployer itself is on 2.x.
  # Remove once @hono/node-ws accepts 2.x.
  "@hono/node-ws>@hono/node-server": ^2.1.3
