pre-commit:
  parallel: true
  jobs:
    - run: pnpm exec ultracite fix {staged_files}
      glob: ["*.{ts,tsx,json,jsonc,css,md,yml}"]
      exclude: [".claude/skills/**"]
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --config .config/commitlint.config.ts --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: pnpm test
    - name: knip
      run: pnpm knip
    - name: arch
      run: pnpm arch
    - name: dupes
      run: pnpm dupes
    - name: stories
      run: pnpm test:stories
