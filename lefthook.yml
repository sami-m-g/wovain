pre-commit:
  parallel: true
  jobs:
    - run: bunx ultracite fix {staged_files}
      glob: ["*.{ts,tsx,json,jsonc,css,md,yml}"]
      exclude: ["docs/**", ".claude/skills/**"]
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: bun run test
    - name: knip
      run: bun run knip
    - name: stories
      run: bun run test:stories
