pre-commit:
  parallel: true
  jobs:
    - run: bunx ultracite fix {staged_files}
      glob: ["*.{ts,tsx,json,jsonc,css,md,yml}"]
      exclude: ["devpost/**", ".claude/skills/**", ".agents/skills/**"]
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck
    - name: gitleaks
      run: gitleaks git --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: bun run test
