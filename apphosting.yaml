# Firebase App Hosting: how the wovain server builds and runs. The backend's
# root directory is the repo root, so pnpm installs the whole workspace.
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

scripts:
  buildCommand: pnpm build
  runCommand: pnpm start

# Plain values, then Secret Manager references set with
# `pulumi config set --secret <name>` in infra/ (see infra/index.ts). Only
# secrets with a value are listed: App Hosting won't build with an empty one.
# FAL_BILLING_KEY, the OTEL_* pair, QLOO_API_KEY (qloo-api-key) and
# TAVILY_API_KEY (tavily-api-key) are listed once they have values.
env:
  # The install skips lifecycle scripts, as CI does (pnpm 12 reads only the
  # pnpm_config_ prefix): the root `prepare` sets up
  # git hooks and agent skills, which a build container doesn't need.
  - variable: pnpm_config_ignore_scripts
    value: "true"
    availability:
      - BUILD
  - variable: WOVAIN_BUCKET
    value: wovain-media
  - variable: WOVAIN_SITE_URL
    value: https://app--wovain.us-central1.hosted.app
  - variable: WORKOS_AUTHKIT_DOMAIN
    value: https://prosperous-skill-12-staging.authkit.app
  - variable: WORKOS_API_KEY
    secret: workos-api-key
  - variable: WOVAIN_ALLOWED_EMAILS
    secret: wovain-allowed-emails
  - variable: META_SYSTEM_USER_TOKEN
    secret: meta-system-user-token
  - variable: FAL_KEY
    secret: fal-key
  - variable: NEBIUS_API_KEY
    secret: nebius-api-key
