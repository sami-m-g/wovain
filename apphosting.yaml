# Firebase App Hosting: how the wovain server builds and runs. The backend's
# root directory is the repo root, so pnpm installs the whole workspace.
runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

scripts:
  buildCommand: pnpm build
  runCommand: pnpm start

# Plain values, then Secret Manager references set with
# `pulumi config set --secret <name>` in infra/ (see infra/index.ts). Only
# secrets with a value are listed: App Hosting won't build with an empty one.
# QLOO_API_KEY (qloo-api-key) and wovain's Meta app, META_APP_ID
# (meta-app-id) and META_APP_SECRET (meta-app-secret), are listed once they
# have values.
env:
  # The install skips lifecycle scripts, as CI does (pnpm 12 reads only the
  # pnpm_config_ prefix): the root `prepare` sets up
  # git hooks and agent skills, which a build container doesn't need.
  - variable: pnpm_config_ignore_scripts
    value: "true"
    availability:
      - BUILD
  - variable: WOVAIN_BUCKET
    value: wovain-media
  # The KMS key that encrypts merchants' Fourthwall and fal grants (infra/).
  - variable: WOVAIN_KMS_KEY
    value: projects/wovain/locations/us-central1/keyRings/wovain/cryptoKeys/connections
  # Traces go to the group's GitLab Observability (apps/server/src/telemetry.ts),
  # which the self-healing loop reads. Its OTLP endpoint takes data without a
  # token until enforcement is turned on (docs.gitlab.com, operations/
  # observability/ci_cd); then OTEL_EXPORTER_OTLP_HEADERS becomes a secret.
  - variable: OTEL_EXPORTER_OTLP_ENDPOINT
    value: https://144066465.otel.gitlab-o11y.com:14318
  - variable: WOVAIN_SITE_URL
    value: https://app--wovain.us-central1.hosted.app
  # Autopilot's kill switch: "off" refuses new runs and decisions and stops
  # a running run at its next paid job.
  - variable: WOVAIN_AUTOPILOT
    value: "on"
  # The optimizer (docs/changes/25-optimizer): its operator switch, the
  # Cloud Tasks queue and the account tasks call /tasks/* as (infra/tasks.ts),
  # and the debounce window for webhook events.
  - variable: WOVAIN_OPTIMIZER
    value: "on"
  - variable: WOVAIN_OPTIMIZER_QUEUE
    value: projects/wovain/locations/us-central1/queues/optimizer
  - variable: WOVAIN_OPTIMIZER_DEBOUNCE_SECONDS
    value: "120"
  - variable: WOVAIN_TASKS_SERVICE_ACCOUNT
    value: tasks-invoker@wovain.iam.gserviceaccount.com
  - variable: WORKOS_AUTHKIT_DOMAIN
    value: https://prosperous-skill-12-staging.authkit.app
  - variable: WORKOS_API_KEY
    secret: workos-api-key
  - variable: WOVAIN_ALLOWED_EMAILS
    secret: wovain-allowed-emails
  - variable: FAL_KEY
    secret: fal-key
  - variable: NEBIUS_API_KEY
    secret: nebius-api-key
  - variable: TAVILY_API_KEY
    secret: tavily-api-key
  # Generated by infra/ (random.RandomBytes), so they always have a value: the
  # optimizer's HMAC key for buyers' customer keys, and the token Meta echoes
  # when it verifies /webhooks/meta.
  - variable: OPTIMIZER_CUSTOMER_KEY
    secret: optimizer-customer-key
  - variable: META_WEBHOOK_VERIFY_TOKEN
    secret: meta-webhook-verify-token
