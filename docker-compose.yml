name: wovain

# The timings every service's healthcheck shares.
x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/wovain
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      <<: *healthcheck
      start_period: 10s
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: apps/fumadocs/Dockerfile
      secrets:
        - docs_env
    init: true
    ports:
      - "4000:4000"
    env_file:
      - path: apps/fumadocs/.env.local
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/docs').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      <<: *healthcheck
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: wovain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - wovain_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      <<: *healthcheck
    restart: unless-stopped

volumes:
  wovain_postgres_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  docs_env:
    file: apps/fumadocs/.env.local
